/* Dock the workspace navigation to the left edge below the app header. */
.container:has(> .layout-side > .snav){max-width:none;margin:0;padding:0}
.container > .layout-side:has(> .snav){grid-template-columns:220px minmax(0,1fr);gap:0;align-items:stretch;min-height:calc(100dvh - 48px)}
.container > .layout-side > .snav{position:sticky;top:48px;align-self:start;height:calc(100dvh - 48px);max-height:none;margin:0;padding:18px 10px;border:0;border-right:1px solid var(--color-border);border-radius:0;box-shadow:none;background:var(--color-surface-raised)}
.container > .layout-side > .snav ~ .workspace-main,
.container > .layout-side > .snav ~ div{min-width:0;padding:24px 28px 48px}
.container > .layout-side > .snav button{height:38px}
@media(max-width:960px){
  .container > .layout-side:has(> .snav){grid-template-columns:180px minmax(0,1fr)}
  .container > .layout-side > .snav ~ .workspace-main,
  .container > .layout-side > .snav ~ div{padding:20px 18px 36px}
}
@media(max-width:640px){
  .container > .layout-side:has(> .snav){grid-template-columns:1fr}
  .container > .layout-side > .snav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--color-border)}
  .container > .layout-side > .snav .sn-title{display:none}
  .container > .layout-side > .snav button{width:auto;flex:0 0 auto}
  .market-top{flex-direction:column}.market-tools,.market-search{width:100%}
}

const TASK_PACKAGE_SPEC_MARKDOWN="# 安住任务能力包规范 v0.3\n\n> 状态：Draft for Review  \n> 面向对象：业务合作方、产研、平台开发者、审核人  \n> 更新日期：2026-10-14  \n> 当前唯一有效版本\n\n## 1. 规范目标\n\n本规范用于把一个可复用业务场景，逐步整理成安住平台可解析、可审核、可发布、可治理的任务能力包。\n\n```text\n业务需求 → 调用规则 → 数据源 → 工具与权限 → Echo（按需）→ 自测与发布申请\n   ↓          ↓          ↓           ↓              ↓              ↓\n需求文档   invocation   resources   tools       echoBinding     tests/review\n```\n\n基本分工：\n\n- 业务声明业务事实、边界、依赖和验收结果。\n- 平台生成模型路由、追问、参数提取和工具编排配置。\n- 业务不编写 Prompt、思维链、模型路由算法或工具调用顺序。\n- 包内提交的是业务声明和发布申请；真实连接状态、审核结论、Release、Distribution 和运行时 Task 均由平台生成。\n\n术语：\n\n```text\n任务能力 = 面向用户发布的可复用业务能力\nSkill     = 业务能力的声明与注册载体\nTool      = 查询、计算、写入或外部操作的技术接口\nTask      = 某个用户在一次会话中的具体执行实例\nEcho      = 需要 B 端 Agent 或真人服务者时使用的 B 端任务平台\n```\n\n## 2. 六步填写流程\n\n业务可以通过智能创建、引导式表单或本地包完成以下六步。三个入口最终生成同一种标准包。\n\n### 第一步：提交业务需求文档\n\n**交付物：`references/business-brief.md`。**\n\n至少包含：\n\n- 目标用户及当前问题。\n- 用户在什么场景下提出需求。\n- 平台需要帮助用户完成什么。\n- 用户最终获得的结果。\n- 能力边界和明确不做的事情。\n- 1—3 个真实用户表达示例。\n- 业务 Owner、所属团队、技术 Owner 和支持团队。\n\n平台据此生成 `plugin.json` 和 `anju.json.capability` 草稿。业务 Owner 确认前，AI 补全字段只能标记为建议。\n\n### 第二步：填写调用规则与业务约束\n\n**交付物：一份调用规则说明，由平台写入 `invocation` 和 `businessPolicies`。**\n\n必须写清：\n\n- `when`：什么用户目标或业务状态下允许调用。\n- `requiredContext`：执行前必须获得哪些信息，以及信息的业务含义。\n- `doNotInvokeWhen`：哪些相似需求不属于本能力。\n- `confirmBefore`：哪些写入、发布、交易或外部操作必须再次确认。\n- `businessPolicies`：不得突破的硬规则和可用于排序、推荐的软规则。\n\n硬规则必须可验证、可测试、可审计，不得只存在于 Prompt 中。\n\n### 第三步：登记数据源和知识资源\n\n**交付物：一份数据与知识资源清单，由平台写入 `resourceBindings`。**\n\n每项资源必须给出：\n\n- 数据库、API、事件流、知识库或文档的资源 ID。\n- 使用目的、访问方式和所需字段。\n- 可访问的数据对象和行级范围，例如“仅当前用户授权房源”。\n- 数据分类、用户授权要求、更新频率和保留策略。\n- 业务 Owner、数据/技术 Owner 和测试环境。\n- 资源不可用时的业务处理方式。\n\n不得在包中填写数据库密码、Token、Cookie、API Key 或私钥。\n\n### 第四步：登记工具及权限\n\n**交付物：一份工具与权限清单，由平台写入 `toolRequirements`。**\n\n每项工具必须给出：\n\n- 工具用途，以及属于读取、写入还是对外操作。\n- 已登记工具 ID；若不存在，标为 `new` 或 `extension`。\n- 输入、输出 Schema 和主要错误码。\n- 权限作用域、操作对象和数据范围。\n- 是否必须取得用户确认。\n- 失败、超时或结果未知时的业务降级方式。\n- 技术 Owner 和测试环境。\n\n权限必须遵循最小权限原则。写入、删除、发布、交易、向外部发送信息等操作必须明确确认要求。\n\n### 第五步：配置 Echo（按需）\n\n**交付物：B 端 Skill 和 Echo 对接声明。**\n\n只有任务需要经纪人、顾问、专家等 B 端服务者履约时才配置：\n\n- `skills/<echo-skill>/SKILL.md`：B 端收到任务后的业务处理规范。\n- C 端向 Echo 发送的任务字段。\n- Echo 返回的状态、结果和失败状态。\n- SLA、超时和人工升级方式。\n- Echo/B 端业务 Owner、技术 Owner 和服务团队。\n\nC 端 Skill 决定何时发起及传递什么；B 端 Skill 决定 Echo 收到任务后遵守什么业务规则。具体模型编排仍由各平台生成。\n\n### 第六步：提交自测、审核和发布申请\n\n**交付物：`tests/cases.yaml`、审核角色和发布申请。**\n\n自测至少覆盖：\n\n- 2 个正常调用场景。\n- 1 个信息不足场景。\n- 1 个不应调用场景。\n- 1 个用户确认场景。\n- 1 个工具或数据异常场景。\n- 1 个不得虚构、越权或违规写入场景。\n- 接入 Echo 时，增加成功、超时和升级场景。\n\n业务只声明期望审核角色和期望发布范围。平台审核通过后才生成正式 Release 和 Distribution；“提交发布申请”不等于所有用户立即可见。\n\n## 3. 包结构\n\nZIP 内只允许一个根目录。\n\n```text\ncapability-package/\n├── plugin.json\n├── anju.json\n├── skills/\n│   ├── c-end-capability/\n│   │   └── SKILL.md\n│   └── echo-handler/          # 接入 Echo 时必须\n│       └── SKILL.md\n├── tests/\n│   └── cases.yaml\n├── references/\n│   ├── business-brief.md\n│   └── business-rules.md      # 按需\n├── mcp.json                   # 自带 MCP 服务时需要\n└── assets/\n    └── icon.svg               # 可选\n```\n\n| 文件 | 要求 | 用途 |\n| --- | --- | --- |\n| `plugin.json` | 必须 | 包身份、版本和基础展示信息 |\n| `anju.json` | 必须 | 业务声明、规则、资源、工具、权限、审核和发布申请 |\n| `skills/*/SKILL.md` | 至少一个 | C 端业务能力说明；Echo Skill 按需增加 |\n| `tests/cases.yaml` | 必须 | 机器可解析的业务自测 Case |\n| `references/business-brief.md` | 必须 | 业务需求文档 |\n| `references/` 其他文件 | 可选 | 业务制度、字段字典和稳定参考资料 |\n| `mcp.json` | 按需 | 合作方自带 MCP 服务的连接声明 |\n| `assets/` | 可选 | 图标和静态资源 |\n\n基础限制：ZIP 压缩后不超过 5 MiB，解压后不超过 20 MiB，文件数不超过 200；路径必须为相对路径，不得包含 `..`、绝对路径或符号链接；文本统一使用 UTF-8；不得包含凭据、可执行二进制或依赖目录。\n\n## 4. `plugin.json`\n\n```json\n{\n  \"$schema\": \"https://schemas.anju.example/task-package/0.3/plugin.schema.json\",\n  \"name\": \"dingdingfang\",\n  \"displayName\": \"盯盯房\",\n  \"version\": \"1.0.0\",\n  \"description\": \"持续查找符合用户条件的新房源，并在有更新时通知用户。\",\n  \"icon\": \"./assets/icon.svg\"\n}\n```\n\n`name` 必须为小写英文、数字和单连字符，最长 64 字符，发布后不可修改；`version` 使用 SemVer。\n\n## 5. `anju.json`\n\n以下示例展示 v0.3 的完整骨架；无 Echo 的能力将 `echoBinding.required` 设为 `false`，其余 Echo 字段可省略。\n\n```json\n{\n  \"$schema\": \"https://schemas.anju.example/task-package/0.3/anju.schema.json\",\n  \"specVersion\": \"0.3\",\n  \"capability\": {\n    \"id\": \"dingdingfang\",\n    \"displayName\": \"盯盯房\",\n    \"summary\": \"持续查找符合条件的新房源并通知用户。\",\n    \"category\": \"房产服务\",\n    \"businessScene\": \"持续找房\",\n    \"briefPath\": \"references/business-brief.md\",\n    \"owners\": {\n      \"businessOwner\": \"housing-search-owner\",\n      \"businessTeam\": \"housing-search-business\",\n      \"technicalOwner\": \"anju-housing-platform\",\n      \"supportTeam\": \"dingdingfang-support\"\n    }\n  },\n  \"skill\": { \"path\": \"skills/manage-dingdingfang/SKILL.md\" },\n  \"invocation\": {\n    \"when\": [\"用户明确要求持续关注符合条件的新房源\"],\n    \"requiredContext\": [\n      { \"key\": \"city\", \"businessMeaning\": \"任务所在城市\", \"required\": true, \"appliesTo\": [\"create\"] },\n      { \"key\": \"searchCondition\", \"businessMeaning\": \"至少一个可执行找房条件\", \"required\": true, \"appliesTo\": [\"create\"] }\n    ],\n    \"doNotInvokeWhen\": [\"用户仅需要一次性房源推荐\", \"用户要求监控某一套房源的价格变化\"],\n    \"confirmBefore\": [\"创建盯房任务\", \"重命名任务\", \"终止任务\"]\n  },\n  \"businessPolicies\": [\n    { \"id\": \"current-user-only\", \"level\": \"hard\", \"statement\": \"只能读取和操作当前用户有权访问的数据\" },\n    { \"id\": \"no-result-fabrication\", \"level\": \"hard\", \"statement\": \"不得虚构房源、价格、状态或执行成功\" }\n  ],\n  \"resourceBindings\": {\n    \"dataSources\": [\n      {\n        \"id\": \"listing-events\",\n        \"resourceId\": \"anju.house.listing-events\",\n        \"sourceType\": \"event-stream\",\n        \"purpose\": \"识别新增、下架和价格变化\",\n        \"required\": true,\n        \"access\": {\n          \"mode\": \"read\",\n          \"subject\": \"current-user-authorized\",\n          \"fields\": [\"listingId\", \"city\", \"community\", \"layout\", \"price\", \"status\", \"updatedAt\"]\n        },\n        \"dataPolicy\": {\n          \"classifications\": [\"internal\"],\n          \"userAuthorization\": \"platform-session\",\n          \"freshness\": \"daily-batch\",\n          \"retentionPolicyId\": \"platform-default\"\n        },\n        \"owners\": { \"businessOwner\": \"housing-search-owner\", \"technicalOwner\": \"housing-data-owner\" },\n        \"testEnvironment\": \"housing-data-sandbox\",\n        \"businessFallback\": \"说明暂时无法检查新房源，不返回推测结果\"\n      }\n    ],\n    \"knowledgeBases\": []\n  },\n  \"toolRequirements\": [\n    {\n      \"id\": \"create-watch-task\",\n      \"displayName\": \"创建盯房任务\",\n      \"purpose\": \"在用户确认后创建持续找房任务\",\n      \"source\": \"registered\",\n      \"resourceId\": \"anju.dingdingfang.task.create\",\n      \"requiredVersion\": \">=1.0.0\",\n      \"operation\": \"write\",\n      \"permission\": {\n        \"scopes\": [\"dingdingfang.task:create\"],\n        \"subject\": \"current-user\",\n        \"resourceScope\": \"own-tasks-only\"\n      },\n      \"confirmationRequired\": true,\n      \"inputSchema\": { \"type\": \"object\", \"required\": [\"city\", \"conditions\", \"idempotencyKey\"] },\n      \"outputSchema\": { \"type\": \"object\", \"required\": [\"taskId\", \"status\"] },\n      \"errors\": [\"INVALID_CONDITION\", \"PERMISSION_DENIED\", \"TIMEOUT\", \"UNKNOWN_RESULT\"],\n      \"businessFallback\": \"先按幂等键查询；仍无法确认时告知状态未知，不重复创建\",\n      \"owners\": { \"technicalOwner\": \"anju-housing-platform\" },\n      \"testEnvironment\": \"dingdingfang-sandbox\"\n    }\n  ],\n  \"runtimeOptions\": {\n    \"allowedModes\": [\"recurring\", \"user-confirm\"],\n    \"defaultMode\": \"user-confirm\"\n  },\n  \"echoBinding\": { \"required\": false },\n  \"risk\": {\n    \"declaredLevel\": \"high\",\n    \"usesPersonalData\": true,\n    \"usesSensitivePersonalData\": false,\n    \"performsWriteActions\": true,\n    \"sendsExternalMessages\": false,\n    \"transfersDataExternally\": false\n  },\n  \"reviewRequest\": {\n    \"requiredRoles\": [\"business-owner\", \"tool-owner\", \"data-owner\", \"platform-reviewer\"]\n  },\n  \"publicationRequest\": {\n    \"platforms\": [\"mobile\"],\n    \"entryPoints\": [\"natural-language\", \"task-square\"],\n    \"requestedScope\": \"gray\",\n    \"targetIds\": [\"housing-search-test-users\"]\n  }\n}\n```\n\n### 5.1 调用规则\n\n| 字段 | 要求 | 说明 |\n| --- | --- | --- |\n| `when` | 必须 | 允许调用的用户目标或业务状态 |\n| `requiredContext` | 必须 | `key`、业务含义、是否必需及适用操作 `appliesTo` |\n| `doNotInvokeWhen` | 必须 | 相似但不属于该能力的需求 |\n| `confirmBefore` | 必须 | 必须再次取得用户确认的操作，可为空数组 |\n| `businessPolicies` | 必须 | 可验证的 `hard` 或 `soft` 业务规则 |\n\n### 5.2 数据源\n\n每个必需数据源必须声明 `resourceId`、`sourceType`、`purpose`、`access`、`dataPolicy`、`owners`、`testEnvironment` 和 `businessFallback`。数据访问范围不明确、需要的资源未登记或数据 Owner 未确认时，阻止提交审核。\n\n### 5.3 工具与权限\n\n每项工具必须声明 `operation`、`permission.scopes`、`permission.subject`、`permission.resourceScope`、输入输出 Schema、确认要求、错误码、降级方式、技术 Owner 和测试环境。`source` 可取：\n\n- `registered`：平台工具库已有完整工具。\n- `platform`：定时、通知等平台基础能力。\n- `extension`：已有工具需要扩展；完成前保持草稿。\n- `new`：需要新增工具；完成前保持草稿。\n\n### 5.4 Echo\n\n接入 Echo 时，`echoBinding` 至少包含：\n\n```json\n{\n  \"required\": true,\n  \"sceneId\": \"echo.scene.housing-consultation\",\n  \"skillPath\": \"skills/echo-housing-consultation/SKILL.md\",\n  \"taskInputSchema\": { \"type\": \"object\" },\n  \"statusSchema\": { \"type\": \"object\" },\n  \"resultSchema\": { \"type\": \"object\" },\n  \"sla\": { \"acknowledgeWithinMinutes\": 5, \"completeWithinMinutes\": 120 },\n  \"escalation\": \"超过 SLA 转人工服务台\",\n  \"owners\": {\n    \"businessOwner\": \"echo-housing-owner\",\n    \"technicalOwner\": \"echo-platform-owner\",\n    \"serviceTeam\": \"housing-consultants\"\n  }\n}\n```\n\n平台凭据、内部队列地址和服务账号不得写入包内。\n\n### 5.5 风险、审核和发布申请\n\n- `risk` 是业务风险自声明，平台仍需独立扫描。\n- `reviewRequest.requiredRoles` 声明必须参加的角色；业务 Owner 和平台审核人始终必需，使用数据/工具/Echo 时相应 Owner 必需，高风险时安全合规角色必需。\n- `publicationRequest` 只声明期望平台、入口和范围，不代表实际发布结果。\n- 平台终审通过后生成 Release；再按批准范围生成 Distribution。只有 Distribution 范围内用户能在移动端看到或调用。\n\n## 6. `SKILL.md`\n\n正文至少包含：能力目标、适用与不适用场景、必要输入及业务含义、必须遵守的业务约束、预期结果、成功/失败定义、资源不可用时的业务处置。\n\n正文不得包含：模型思考步骤、隐藏 Prompt、意图分类算法、多 Skill 路由策略、参数抽取算法、工具调用顺序、重试算法、凭据、环境地址或某个用户的 Task 状态。\n\n`anju.json` 与 `SKILL.md` 冲突时，阻断提交并等待业务修正，不自动选择其中一份覆盖。\n\n## 7. `tests/cases.yaml`\n\n```yaml\nversion: \"0.3\"\ncases:\n  - id: create-watch-task\n    type: positive\n    input: \"帮我盯北京回龙观的两居\"\n    expected:\n      capability: dingdingfang\n      behaviors:\n        - collect_required_context\n        - confirm_before_create\n\n  - id: one-time-search-is-not-watch\n    type: negative\n    input: \"推荐几套回龙观的两居\"\n    expected:\n      behavior: do_not_invoke\n\n  - id: create-timeout\n    type: error\n    fixtures:\n      create-watch-task: timeout\n    expected:\n      behavior: query_idempotently_and_report_unknown\n```\n\n每个 Case 至少包含输入、预期动作和预期结果；涉及工具时增加 fixtures、预期工具调用和禁止行为。\n\n## 8. 平台解析与提交门槛\n\n三个创建入口统一生成 `TaskCapabilityDraft`：智能创建、上传 ZIP、引导式表单。平台不得将 AI 推断内容直接升级为正式规则；建议字段必须由对应 Owner 确认。\n\n以下问题阻止提交：\n\n- 缺少需求文档、包身份、能力声明、C 端 Skill 或测试案例。\n- 调用、不调用、必要信息、确认点或硬规则不明确。\n- 数据源缺少访问范围、数据策略、Owner、测试环境或降级方式。\n- 工具缺少权限、Schema、确认要求、错误码、Owner、测试环境或降级方式。\n- 存在未解决的 `new`、`extension` 或必需资源。\n- 需要 Echo 但缺少 B 端 Skill、数据契约、SLA、升级方式或 Owner。\n- 必需审核角色未确认，或风险声明与扫描结果未闭环。\n- 正常、拒绝、确认、异常、越权或 Echo 测试失败。\n- 发布入口、期望范围或目标用户不明确。\n- 包内包含凭据、危险文件或不可解析内容。\n\n## 9. 版本、审核与发布\n\n- 新任务能力建议从 `1.0.0` 开始；试验性内部版本可使用 `0.x`。\n- 业务声明、规则、资源、工具权限、Echo 契约、测试或展示变化时创建新版本。\n- 提交审核时冻结原始包、解析结果、资源与工具解析、模型配置、测试报告、风险结果和包哈希。\n- 标准审核顺序：业务 Owner → 数据/工具/Echo Owner 按需 → 平台终审 → 高风险安全合规加审。\n- 审核通过不等于全量可见；平台按批准范围创建 Distribution。\n- 运行时 Task 必须记录能力版本、工具版本、模型配置版本和实际 Distribution。\n\n## 10. v0.2 到 v0.3 的主要变化\n\n| v0.2 | v0.3 |\n| --- | --- |\n| 以字段参考为主 | 增加六步业务填写流程和每步交付物 |\n| 数据源只有 ID、用途和必需性 | 增加字段范围、数据对象、分类、授权、更新、保留、Owner、环境和降级 |\n| 工具权限主要停留在说明文字 | 增加结构化权限作用域、对象、资源范围、错误码、Owner 和环境 |\n| Echo 只有 `required` 和 `sceneId` | 增加 B 端 Skill、输入/状态/结果契约、SLA、升级和 Owner |\n| 缺少风险、审核和发布申请结构 | 增加 `risk`、`reviewRequest`、`publicationRequest` |\n| 需求文档不是标准包必需项 | `references/business-brief.md` 成为必需材料 |\n\n";
const BUSINESS_COOPERATION_GUIDE_MARKDOWN="# 安住业务能力接入指南 v1.3\n\n> 对外简版  \n> 适用对象：希望将业务能力接入安住 AI 的业务团队和合作方  \n> 更新日期：2026-10-14\n\n## 一句话说明\n\n合作方负责把业务场景、调用条件、业务规则和工具说清楚；C 端能力平台负责把这些材料配置成可被安住调用的任务能力；安住负责面向用户提供入口、交互和结果。\n\n合作方不需要编写模型 Prompt，也不需要设计模型如何思考和调用工具。\n\n## 业务接入只需要关注三件事\n\n1. **需要准备什么：**需求文档、调用规则、数据与接口清单、业务自测 Case 和目标人群包；需要 B 端履约时再补充 Echo 材料。\n2. **如何完成配置：**业务确认规则并选择人群包，产研完成数据和工具配置，平台生成模型配置、组织测试并发布。\n3. **配置后有什么效果：**人群包先召回候选任务，平台再在单用户内部完成任务优先级分发。\n\n## 1. 合作方需要准备什么\n\n### 业务场景\n\n**交付物：一份业务需求文档。**\n\n以盯盯房为例，文档中需要包含目标用户、持续盯房场景、用户最终获得的通知与房源结果、能力边界，以及“帮我盯上海内环内、500 万以内的两居室”等典型需求。\n\n### 调用规则\n\n**交付物：一份调用规则说明。**\n\n以盯盯房为例，需要写清只有用户表达持续监控意图时才调用；城市、范围和预算口径是必要信息；一次性找房不能创建盯房任务；创建前需要确认；用户可以查看、重命名和停止任务。\n\n### 数据与工具\n\n**交付物：一份数据与接口清单。**\n\n以盯盯房为例，需要列出房源数据库或搜索接口、房源新增和价格变化数据、盯房任务的创建/查询/修改/停止接口、消息通知接口，并提供字段、权限、测试环境、业务 Owner 和技术联系人。\n\n### 验收案例\n\n**交付物：一组业务自测 Case。**\n\n每个 Case 写明用户输入、预期动作和预期结果。盯盯房至少覆盖：正常创建、信息不足时追问、一次性找房不调用、动态预算、查看/重命名/停止任务、接口异常、无匹配结果和越权访问。\n\n### 目标人群包\n\n**交付物：一个已就绪的人群包。**\n\n业务需要自行圈定该任务要面向的用户，并提供人群包名称、圈选口径、数据来源、更新频率、授权和 Owner。以盯盯房为例，可选择“北京购房意向人群”或“重点小区持续关注人群”。\n\n人群包是发布配置，不需要写入 Skill 文件。它用于为用户召回候选任务；如果同一用户命中多个任务，由平台统一计算优先级，业务不需要串联 Skill。\n\n## 2. 如何完成配置\n\n业务不需要编写 Prompt，也不需要配置模型如何选择和调用工具。配置由业务、产研和平台共同完成：\n\n### 开始发布配置前：先准备好外部依赖\n\n发布页只能选择已经就绪的人群包、数据和工具，不在发布表单里临时创建。Echo 接入作为任务发布的可选配置，在 C 端场景注册后完成绑定。\n\n- **每个任务必须：**先在人群平台自行圈定目标用户，完成口径、数据来源、更新频率、授权和 Owner 配置。\n- **需要使用业务数据：**先在数据后台注册自己的数据库或数据源，配好字段、数据范围、访问权限和 Owner。\n- **需要调用业务系统：**先将接口注册为平台工具，完成可用性校验、读写权限申请和责任人确认。\n- **需要 B 端服务者履约：**准备供 Echo 执行的 B 端 Skill，并明确输入、处理规则、状态与返回结果、异常升级方式和 Owner。不需要业务方先去 Echo 单独创建任务。\n\n以上依赖就绪后，再进入“发布任务”流程。保存任务草稿时，C 端能力平台会注册业务场景并自动颁发场景 Key / ID；如启用 Echo，在“配置任务”中选择或提供 Echo Skill，由平台校验后完成绑定。\n\n```text\n① 提交业务材料\n        ↓\n② 配置数据与工具\n        ↓\n③ 选择人群包，按需配置 Echo，完成联合测试\n        ↓\n④ 审核发布\n```\n\n### 第一步：提交业务材料\n\n合作方提交需求文档、调用规则、数据与接口清单和自测 Case。\n\nC 端能力平台将材料整理为标准 Skill 和任务能力草稿。AI 补充的规则必须由业务确认。\n\n产出：业务 Brief 和任务能力草稿。\n\n### 第二步：配置数据与工具\n\n业务确认调用条件、禁止条件和用户确认点；产研绑定数据库、接口、字段范围、工具权限、测试环境和负责人。\n\n如果平台已有工具，直接完成绑定；如果需要新增或扩展接口，则先完成工具开发和联调。\n\n产出：业务确认的能力声明、数据绑定和工具权限配置。\n\n### 第三步：平台配置与联合测试\n\n业务在发布配置中选择至少一个已就绪的目标人群包。C 端能力平台生成模型配置，并根据正常、不应调用、信息不足、用户确认和异常案例进行测试。\n\n合作方只需要判断业务行为和结果是否正确，不需要审查内部 Prompt，也不需要配置多个任务的串联和优先级。\n\n产出：目标人群绑定、测试结果和业务验收结论。\n\n### 第四步：审核发布\n\n测试通过后提交审核。审核通过后生成正式版本，再配置发布范围；只有同时处于发布范围内且命中人群包的用户，该任务才会进入候选池。\n\n产出：可被用户调用的正式任务能力。\n\nC 端能力平台在整个过程中负责：\n\n- 将业务材料整理为标准 Skill 和任务能力草稿。\n- 按人群包为用户召回候选任务，并在单用户内部完成任务优先级分发。\n- 配置模型如何识别场景、补充信息并调用工具。\n- 完成数据、工具、权限和安全检查。\n- 组织联合测试、审核和发布。\n- 提供版本、监控、下架和问题追踪能力，并将发布后的能力提供给安住。\n\n## 3. 配置后有什么效果，用户怎么用\n\n“发布”不等于立即向所有用户公开。任务首先受发布范围限制，再按业务选择的人群包进入用户候选池。\n\n运行逻辑是：\n\n```text\n业务为任务选择人群包\n        ↓\n平台按人群包为用户召回候选任务\n        ↓\n同一用户命中多个任务时，平台计算优先级\n        ↓\n展示或触发当前最合适的任务\n```\n\n业务不需要串联 Skill，也不需要配置单用户内部的任务优先级。\n\n平台发布时需要确定：\n\n- 目标人群包：业务至少选择一个已就绪的人群包。\n- 发布范围：测试用户、指定团队、灰度用户或正式目标用户。\n- 是否在任务广场展示。\n- 是否支持用户通过 `@` 主动调用。\n- 是否允许模型根据自然语言自动匹配。\n- 生效时间和下架条件。\n\n对于同时在发布范围内且命中人群包的用户，移动端会出现以下变化：\n\n1. 平台先按人群包为用户召回候选任务，再完成用户内部的优先级分发。\n2. 如果开启任务广场展示，用户可以看到任务卡片和详情。\n3. 用户可以通过自然语言或 `@任务名称` 发起该能力。\n4. 平台收集当前用户的必要信息和确认项。\n5. 用户确认后，才创建一次具体的运行时 Task。\n6. 如果任务需要 Echo，移动端展示 B 端处理状态，并在 Echo 返回后展示结果或下一步操作。\n\n以盯盯房为例，用户实际使用流程是：\n\n```text\n用户命中“北京购房意向”人群包\n        ↓\n平台召回盯盯房任务\n        ↓\n用户说“帮我持续盯回龙观两居”\n        ↓\n平台识别到盯盯房任务能力\n        ↓\n补充城市、预算等必要信息\n        ↓\n向用户展示完整任务条件\n        ↓\n用户确认后创建运行时 Task\n        ↓\n移动端展示任务状态，有新房源时通知用户\n```\n\n用户可以通过两种方式使用：\n\n- 在任务广场看到任务卡片和使用示例后发起。\n- 在会话中直接描述需求，或通过 `@任务名称` 主动调用。\n\n配置完成后，业务应该能够在验收环境看到：用户会怎样表达、平台会追问什么、确认页展示什么、Task 创建后在哪里查看，以及成功、无结果和异常时如何反馈。\n\n```text\n审核通过\n   ↓\n生成正式版本\n   ↓\n配置发布范围与移动端入口\n   ↓\n范围内用户可见、可调用\n   ↓\n用户确认后创建运行时 Task\n```\n\n## 4. 整体协作关系\n\n```text\n                              业务方\n                 提供业务材料、数据工具和 Skill\n                                │\n                                ▼\n用户  ⇄  安住  ⇄  C 端能力平台  ⇄  Echo｜B 端平台\n          │             │                   │\n          │             ├─ 注册场景并颁发 Key ├─ 按 Key 加载 B 端 Skill\n          │             ├─ 连接数据与工具     ├─ 组织 Agent 或真人履约\n          │             └─ 绑定 Echo Skill       └─ 透传 Key，返回状态与结果\n          │\n          └─ 统一承接会话、确认、进度和结果展示\n```\n\n- **业务方**提供可被平台使用的业务能力，并确认业务结果是否正确。\n- **用户**通过安住提出需求、确认任务并查看进度和结果。\n- **安住**是统一用户入口，承接会话、交互、确认和结果展示。\n- **C 端能力平台**是业务接入入口，负责注册业务场景、颁发场景 Key / ID，并管理 Skill、数据、工具及发布版本。\n- **Echo B 端平台**只在需要经纪人、顾问、专家等服务者履约时参与。\n- C 端能力平台通过场景 Key / ID 向 Echo 派发任务；Echo 根据绑定关系加载 B 端 Skill，返回处理状态和结果，再由安住反馈给用户。\n\n> 用户入口是安住，业务接入入口是 C 端能力平台。\n\n## 5. 双方如何分工\n\n合作业务方负责：\n\n- 定义业务目标和结果。\n- 确认调用条件和业务边界。\n- 自行圈定任务的目标人群包，维护口径和 Owner。\n- 提供真实可用的数据、工具和负责人。\n- 通过自测 Case 判断行为和结果是否正确。\n\nC 端能力平台负责：\n\n- 生成标准 Skill 和任务能力草稿。\n- 按人群包召回候选任务，并在单用户内部做任务优先级分发。\n- 配置模型识别、追问和工具调用。\n- 注册业务场景并生成唯一的场景 Key / ID。\n- 校验场景与 Echo Skill，保存 Key / ID 到 Skill 发布版本的绑定关系。\n- 完成权限、安全和稳定性检查。\n- 组织测试、审核、发布和监控，并将发布后的能力提供给安住。\n\n## 6. 需要 B 端服务者时：接入 Echo\n\n如果一项任务能力只需要查询、计算或调用普通工具，可以由 C 端能力平台连接工具完成，并通过安住向用户反馈。\n\n如果任务执行过程中需要经纪人、顾问、专家等 B 端服务者参与，则需要同时配置 B 端任务平台 **Echo**。\n\n业务方需要额外提供：\n\n- 一份供 Echo 加载执行的 B 端 `SKILL.md`。\n- C 端需要传给 Echo 的任务信息和业务上下文。\n- B 端执行过程中的状态及最终返回结果。\n- 异常、超时或无法处理时的升级方式。\n- B 端业务负责人、服务团队和工具权限。\n\n场景注册与 B 端绑定流程：\n\n```text\n业务方在 C 端创建并保存任务草稿\n        ↓\nC 端注册业务场景，自动生成场景 Key / ID\n        ↓\n业务方在“配置任务 → B 端 Echo 平台”中选择或提供 Echo Skill\n        ↓\n平台校验场景归属、Key 有效性、Skill 完整性及可用版本\n        ↓\n保存“场景 Key / ID → Echo Skill 发布版本”绑定，完成 B 端注册\n```\n\n在发布页中，场景 Key / ID 由平台默认展示且只读，业务方不需要手工填写。场景 Key / ID 是跨平台的场景标识，不是调用凭证；C 端与 Echo 之间仍需使用独立的服务身份认证和权限校验。\n\n运行时调用流程：\n\n```text\n用户通过安住提出需求\n        ↓\nC 端能力平台匹配任务能力\n        ↓\n将场景 Key / ID、任务信息和业务上下文发送给 Echo\n        ↓\nEcho 根据场景 Key / ID 查询绑定，加载对应的 B 端 Skill 发布版本\n        ↓\nB 端 Agent 或真人服务者执行\n        ↓\n如下游需要识别任务场景，Echo 继续透传场景 Key / ID\n        ↓\nEcho 返回状态和结果\n        ↓\n安住向用户展示进度和结果\n```\n\n两份 Skill 的职责不同：\n\n- C 端 Skill：说明什么时候需要发起该任务，以及需要向 Echo 传递什么。\n- Echo Skill：说明 B 端接到任务后如何处理、需要调用哪些工具、如何返回结果。\n\n场景 Key / ID 只负责连接两端，不替代两份 Skill：C 端 Skill 负责“何时发起”，Echo Skill 负责“收到后如何履约”。\n\n## 7. 谁来审核\n\n审核不是由业务方或平台单独完成，而是根据内容和风险由不同角色共同负责。\n\n| 审核角色 | 负责确认什么 | 是否必须 |\n| --- | --- | --- |\n| 业务 Owner | 业务场景、调用条件、目标人群、规则、结果和案例是否正确 | 必须 |\n| 人群包 Owner | 圈选口径、数据来源、更新频率、授权和失效处理 | 必须 |\n| 数据或工具 Owner | 数据来源、接口能力、权限和异常处理是否可用 | 使用相关资源时必须 |\n| Echo / B 端 Owner | B 端 Skill、处理流程、服务边界、状态和返回结果是否正确 | 接入 Echo 时必须 |\n| C 端能力平台审核人 | 材料完整性、测试结果、场景 Key 与 Echo Skill 绑定、人群包、权限、安全、版本和发布范围 | 必须，负责最终发布决定 |\n| 安全或合规负责人 | 敏感数据、高风险写操作或特殊合规要求 | 命中风险时必须 |\n\n标准顺序：\n\n```text\n业务 Owner 和人群包 Owner 确认\n   ↓\n资源与 Echo 负责人确认（按需）\n   ↓\nC 端能力平台审核\n   ↓\n安全或合规加审（按风险）\n   ↓\n通过后生成正式版本并配置发布范围\n```\n\n任何必需审核人未确认，任务能力只能保留在草稿或待审核状态，不能进入移动端发布范围。\n\n## 8. 示例：房源推广\n\n| 接入阶段 | 合作方提供 | C 端能力平台处理 | 阶段结果 |\n| --- | --- | --- | --- |\n| 提交方案 | 用户希望推广已维护房源 | 判断是否具备复用价值 | 房源推广 Brief |\n| 对齐规则 | 仅限本人授权房源；发布前必须确认 | 绑定房源数据和推广工具 | 能力声明与工具绑定 |\n| 选择人群 | 圈定已维护房源且有推广意向的业主 | 校验人群包口径、授权和 Owner | 任务绑定目标人群包 |\n| 联合测试 | 提供正常、越权、确认和异常案例 | 生成模型配置并执行测试 | 业务验收通过 |\n| 审核发布 | 业务 Owner 确认规则和展示内容 | 平台审核并配置发布范围 | 范围内用户可调用“房源推广” |\n\n## 9. 什么情况下可以上线\n\n- 调用和不调用的条件已经明确。\n- 已选择至少一个已就绪的目标人群包。\n- 人群口径、更新频率、授权和 Owner 已确认。\n- 所需数据和工具能够稳定使用。\n- 写入或对外操作前会向用户确认。\n- 异常时不会虚构结果或越权执行。\n- 业务验收结果符合预期。\n- 业务和技术负责人已经明确。\n- 如需 B 端服务者，场景 Key / ID 与 Echo Skill 的绑定已校验，且调用、状态返回和下游透传已通过联调。\n- 必需审核角色已完成确认，发布范围和移动端入口已经明确。\n\n## 10. 提交前快速检查\n\n- [ ] 已说明谁在什么场景下使用。\n- [ ] 已说明什么时候调用、什么时候不调用。\n- [ ] 已自行圈定目标人群，并选择已就绪的人群包。\n- [ ] 已列出必须遵守的业务规则。\n- [ ] 已准备数据、工具及其负责人。\n- [ ] 已提供正常、异常和越权案例。\n- [ ] 已明确什么结果算验收通过。\n- [ ] 如需 B 端服务者，已由 C 端生成场景 Key / ID，并完成该 Key / ID 与 Echo Skill 发布版本的校验和绑定。\n- [ ] 如需 B 端服务者，已定义 Echo 的输入、状态、返回结果、超时和异常升级方式。\n- [ ] 已明确业务审核人、平台审核人及按需审核角色。\n- [ ] 已明确发布范围、移动端展示方式和调用入口。\n\n> 合作方把业务和目标人群说清楚，C 端能力平台把能力配置好、按人群包召回任务并提供给安住；安住统一面向用户，需要 B 端服务者时由 Echo 承接履约。\n\n";

function pendingIntent(cid){ return state.intents.find(i=>i.contentId===cid && (i.status==='GENERATED'||i.status==='OPENED') && i.expiresAt>Date.now()); }
function ctaOf(c){
  const ins = c.install;
  if(ins && ins.state!=='removed'){
    switch(ins.state){
      case 'requested': case 'installing': return {label:'前往 Agent 查看', icon:'ri-download-2-line', act:'goto-ide', note:'等待安装'};
      case 'configuration_required': return {label:'完成配置', icon:'ri-links-line', act:'goto-ide-config', note:'待配置'};
      case 'ready': return {label:'去使用', icon:'ri-play-circle-line', act:'use', primary:true};
      case 'disabled': return {label:'前往 Agent 启用', icon:'ri-play-line', act:'goto-ide'};
      case 'error': return {label:'前往 Agent 排障', icon:'ri-tools-line', act:'goto-ide-err'};
      case 'unknown': return {label:'前往 Agent 排障', icon:'ri-refresh-line', act:'goto-ide-err', note:'状态待同步'};
      case 'uninstalling': return {label:'前往 Agent 查看', icon:'ri-loader-4-line', act:'goto-ide', note:'正在卸载'};
    }
  }
  const it = pendingIntent(c.id);
  if(it) return {label:'等待 Agent 确认', icon:'ri-time-line', act:'reopen-intent', note:'重新唤起'};
  return {label:'在 安住 中安装', icon:'ri-install-line', act:'install', primary:true};
}

/* ======================================================================
 * 路由
 * ==================================================================== */
function parseHash(){
  const raw = location.hash.replace(/^#\/?/,'') || 'market';
  const [pathPart, queryPart] = raw.split('?');
  const segs = pathPart.split('/');
  const query = {};
  if(queryPart) queryPart.split('&').forEach(kv=>{ const [k,v]=kv.split('='); if(k) query[k]=decodeURIComponent(v||''); });
  return { page:segs[0]||'me', param:segs[1]||'local', sub:segs[2]||'', query };
}
function nav(hash, replace){
  if(replace){ history.replaceState(null,'',hash); render(); }
  else location.hash = hash;
}
window.addEventListener('hashchange', ()=>{ saveScroll(); render(); restoreScroll(); });

const scrollMem = {};
let lastHashKey = location.hash;
function saveScroll(){ scrollMem[lastHashKey] = window.scrollY; }
function restoreScroll(){
  const y = scrollMem[location.hash];
  requestAnimationFrame(()=>{ if(y!=null) window.scrollTo(0,y); });
  lastHashKey = location.hash;
}

let refocusSearch=false, refocusTaskSearch=false, refocusToolSearch=false, scrollTopNext=true, skipAnim=false;
function render(){
  const {page,param,sub,query} = parseHash();
  const navKey = page==='review' ? 'review' : (page==='me' ? 'me' : '');
  document.querySelectorAll('#main-nav .tn-item').forEach(a=>a.classList.toggle('active', a.dataset.nav===navKey));
  const app = document.getElementById('app');
  let html='';
  try{
    if(page==='market') html = pageMarket(query);
    else if(page==='detail') html = workspaceFrame('local', pageDetail(param, sub||'overview', query));
    else if(page==='me') html = pageMe(param||'local', query);
    else if(page==='review') html = workspaceFrame('review', pageReview(param));
    else if(page==='publish') html = workspaceFrame('local', pagePublish(param,query));
    else html = pageMe('local');
  }catch(err){ html = `<div class="card empty"><span class="e-icon"><i class="ri-error-warning-line"></i></span><div class="e-title">页面渲染失败</div><div class="e-desc">${esc(err.message)}</div></div>`; console.error(err); }
  app.innerHTML = html;
  skipAnim=false;
  if(refocusSearch){ const q=document.getElementById('market-q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} refocusSearch=false; }
  if(refocusTaskSearch){ const q=document.getElementById('task-manage-q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} refocusTaskSearch=false; }
  if(refocusToolSearch){ const q=document.getElementById('tool-catalog-q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} refocusToolSearch=false; }
  if(scrollTopNext){ window.scrollTo(0,0); scrollTopNext=false; }
  if(window.parent!==window) window.parent.postMessage({type:'task-center-admin-route',route:(location.hash||'#/market').slice(1)}, '*');
}

/* 轻量 Markdown 渲染：仅支持标题 / 段落 / 列表 / 粗体 / 行内代码（输入全部来自本地 Mock 数据，先转义再格式化） */
function mdLite(md){
  const inline=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  let html='', inList=false, listType='';
  const closeList=()=>{ if(inList){ html+=listType==='ul'?'</ul>':'</ol>'; inList=false; } };
  for(const raw of md.split('\n')){
    const line=raw.trimEnd();
    if(!line.trim()){ closeList(); continue; }
    let m;
    if((m=line.match(/^###\s+(.*)/))){ closeList(); html+=`<h4>${inline(m[1])}</h4>`; }
    else if((m=line.match(/^##\s+(.*)/))){ closeList(); html+=`<h3>${inline(m[1])}</h3>`; }
    else if((m=line.match(/^#\s+(.*)/))){ closeList(); html+=`<h2>${inline(m[1])}</h2>`; }
    else if((m=line.match(/^[-•]\s+(.*)/))){ if(!inList||listType!=='ul'){ closeList(); html+='<ul>'; inList=true; listType='ul'; } html+=`<li>${inline(m[1])}</li>`; }
    else if((m=line.match(/^\d+[.)]\s+(.*)/))){ if(!inList||listType!=='ol'){ closeList(); html+='<ol>'; inList=true; listType='ol'; } html+=`<li>${inline(m[1])}</li>`; }
    else { closeList(); html+=`<p>${inline(line)}</p>`; }
  }
  closeList();
  return html;
}

/* 详情页 Mock：版本列表（由当前可见 Release 向前推导） */
function versionsOf(c){
  const parts=c.version.split('.').map(Number);
  const base=new Date(c.releasedAt+'T00:00:00');
  const fmt=d=>`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  const out=[{ver:'v'+c.version, date:fmt(base), notes:c.releaseNotes, latest:true}];
  const notesPool=['Publishing existing version without modifications','fix: 边界场景处理与文案修订','feat: 补充企业环境适配与权限说明','chore: 依赖与 manifest 校验升级'];
  for(let i=1;i<=4;i++){
    const p=[...parts];
    if(p[2]>0){ p[2]=Math.max(0,p[2]-1); }
    else if(p[1]>0){ p[1]-=1; p[2]=2; }
    else if(p[0]>0){ p[0]-=1; p[1]=1; p[2]=0; }
    const d=new Date(base); d.setDate(d.getDate()-i*9);
    out.push({ver:'v'+p.join('.'), date:fmt(d), notes:notesPool[(i-1)%notesPool.length], latest:false});
    parts[0]=p[0]; parts[1]=p[1]; parts[2]=p[2];
  }
  return out;
}

function pageReview(taskId){
  const t=REVIEW_TASKS.find(x=>x.id===taskId)||REVIEW_TASKS.find(x=>x.status==='PENDING');
  if(!t) return `<div class="card empty"><span class="e-icon"><i class="ri-checkbox-circle-line"></i></span><div class="e-title">暂无审核任务</div><button class="btn secondary" data-action="go" data-id="/me/review"><i class="ri-arrow-left-line"></i>返回审核中心</button></div>`;
  const pend=REVIEW_TASKS.filter(x=>x.status==='PENDING');
  const done=REVIEW_TASKS.filter(x=>x.status!=='PENDING');
  const decided = t.status!=='PENDING';
  const checkChip={pass:'<span class="chip c-success">通过</span>',warn:'<span class="chip c-warning">需关注</span>',block:'<span class="chip c-danger">未通过</span>'};
  const tools=reviewTools(t);
  const status=reviewStatus(t);
  const canReview=!decided&&t.submitter!==ME.name;
  return `
  <div class="breadcrumb"><a href="#/me/review">审核中心</a><i class="ri-arrow-right-s-line"></i><span>审核详情</span></div>
  <div class="review-layout">
    <div class="card rq">
      <div class="rq-head">待部门审核 <span class="chip c-warning nums">${pend.length}</span></div>
      ${pend.map(x=>`<div class="rq-item ${x.id===t.id?'active':''}" data-action="go" data-id="/review/${x.id}">
        <div class="rq-name">${esc(x.name)} <span class="subtle mono">v${esc(x.version)}</span></div>
        <div class="rq-meta"><span class="chip c-warning">待审核</span><span>${esc(x.department||x.support||'找房策略组')}</span></div>
      </div>`).join('')||'<div class="empty" style="padding:20px"><div class="e-desc">无待审任务</div></div>'}
      <div class="rq-label" style="border-top:0.5px solid var(--color-border)">已处理</div>
      ${done.map(x=>`<div class="rq-item ${x.id===t.id?'active':''}" data-action="go" data-id="/review/${x.id}">
        <div class="rq-name">${esc(x.name)} <span class="subtle mono">v${esc(x.version)}</span></div>
        <div class="rq-meta"><span class="chip ${reviewStatus(x).tone}">${esc(reviewStatus(x).label)}</span><span class="nums">${esc(x.at||'')}</span></div>
      </div>`).join('')}
    </div>

    <div>
      <div class="card d-sec">
        <div class="ds-head"><i class="ri-file-info-line"></i><h2>${esc(t.name)} <span class="subtle mono">v${esc(t.version)}</span></h2><span style="margin-left:auto"><span class="chip ${status.tone}">${esc(status.label)}</span></span></div>
        <div class="ds-body">
          <p style="font-size:13px;color:var(--color-fg-muted)">${esc(t.desc||'')}</p>
          <dl class="kv" style="display:grid">
            <div><div class="k">提交人</div><div class="v" style="display:flex;align-items:center;gap:8px">${avatarHTML(t.submitter,'sm')}${esc(t.submitter)}</div></div>
            <div><div class="k">所属部门</div><div class="v">${esc(t.department||t.support||'找房策略组')}</div></div>
            <div><div class="k">任务版本</div><div class="v mono">v${esc(t.version)}</div></div>
          </dl>
        </div>
      </div>

      ${t.diff?`<div class="card d-sec"><div class="ds-head"><i class="ri-file-list-3-line"></i><h2>本次提交</h2></div>
        <div class="ds-body">${t.diff.map(d=>`<div class="diff-line diff-mod">${esc(d.s)}</div>`).join('')}</div>
      </div>`:''}

      <div class="card d-sec"><div class="ds-head"><i class="ri-tools-line"></i><h2>工具权限</h2><span class="chip c-neutral nums" style="margin-left:auto">${tools.length} 项</span></div>
        <div class="ds-body" style="padding:0"><table class="tbl"><thead><tr><th>工具标识</th><th>工具名称</th><th>调用方式</th><th>允许操作</th><th>业务域</th></tr></thead><tbody>${tools.map(tool=>`<tr><td class="mono">${esc(tool.id)}</td><td><b>${esc(tool.name)}</b></td><td><span class="chip ${tool.defaultCall?'c-info':'c-neutral'}">${tool.defaultCall?'默认调用':'任务申请'}</span></td><td>${tool.actions.map(a=>`<span class="tag ${a==='保存'?'t-warn':'t-neutral'}">${esc(a)}</span>`).join(' ')}</td><td>${esc(tool.domain)}</td></tr>`).join('')}</tbody></table></div>
      </div>

      ${t.checks?`<div class="card d-sec"><div class="ds-head"><i class="ri-shield-check-line"></i><h2>自动校验</h2></div>
        <div class="ds-body" style="gap:0">${t.checks.map(ch=>`<div class="check-item">${checkChip[ch.r]}<div><span class="ck-name">${esc(ch.n)}</span>${ch.note?`<div class="ck-note">${esc(ch.note)}</div>`:''}</div></div>`).join('')}</div>
      </div>`:''}

      ${t.status==='DECIDED'&&t.decision==='APPROVED'?`<div class="banner b-success"><i class="ri-checkbox-circle-line"></i><div class="b-body">已于 ${esc(t.at)} 由 ${esc(t.by)} 通过并发布。</div></div>`:''}
      ${t.status==='DECIDED'&&t.decision==='CHANGES_REQUESTED'?`<div class="banner b-warning"><i class="ri-edit-line"></i><div class="b-body">已于 ${esc(t.at)} 由 ${esc(t.by)} 退回修改。${t.comment?`意见：${esc(t.comment)}`:''}</div></div>`:''}

      ${!decided&&!canReview?`<div class="banner b-info"><i class="ri-information-line"></i><div class="b-body">这是你提交的任务，需要由其他部门管理员审核。</div></div>`:''}

      ${canReview?`
      <div class="card decision-bar">
        <div class="db-title">部门审核 <span class="muted" style="font-weight:400;font-size:12px">提交人不能审核自己的任务</span></div>
        <textarea class="input" id="review-comment" placeholder="退回修改时，请填写具体问题和修改建议"></textarea>
        <div class="db-actions">
          <button class="btn secondary" data-action="review-changes" data-id="${t.id}"><i class="ri-edit-line"></i>退回修改</button>
          <button class="btn primary" data-action="review-approve" data-id="${t.id}"><i class="ri-checkbox-circle-line"></i>通过并发布</button>
        </div>
      </div>`:''}
    </div>
  </div>`;
}

function pageAgent(tab){
  const installed=CONTENTS.filter(c=>c.install && c.install.state!=='removed');
  const groups={
    pending: state.intents.filter(i=>i.status==='OPENED'&&i.expiresAt>Date.now()),
    user: installed.filter(c=>c.install.target.indexOf('User')===0),
    project: installed.filter(c=>c.install.target.indexOf('Project')===0),
    updates: installed.filter(c=>c.install.updateAvailable||c.install.updateFailed),
  };
  const tabs=[
    {k:'pending',l:'待确认安装',icon:'ri-download-2-line',c:groups.pending.length},
    {k:'user',l:'全局',icon:'ri-user-6-line',c:groups.user.length},
    {k:'project',l:'项目',icon:'ri-folder-line',c:groups.project.length},
    {k:'updates',l:'更新可用',icon:'ri-arrow-up-circle-line',c:groups.updates.length},
  ];
  let body='';
  if(tab==='pending') body = groups.pending.length? groups.pending.map(i=>{const c=byId(i.contentId);return `
    <div class="card ide-item"><div class="ii-head"><h4>${esc(c.name)} <span class="subtle mono">v${esc(c.version)}</span></h4>${typeBadge(c.type)}<span class="chip c-info">InstallIntent · OPENED</span>
      <div class="ii-actions"><button class="btn primary sm" data-action="reopen-intent" data-id="${c.id}"><i class="ri-check-line"></i>确认安装</button></div></div>
      <div class="ii-meta"><span>来自 Marketplace Web 的安装意图</span><span class="mono">intent_id=${esc(i.id)}</span><span>需重新校验身份、目标、运行环境与组织策略</span></div></div>`;}).join('')
    : ideEmpty('ri-time-line','暂无待确认安装','从 Marketplace Web 点击「在 安住 中安装」后，意图将出现在这里等待目标确认。');
  else if(tab==='user'||tab==='project'){
    const isUser=tab==='user';
    body = groups[tab].map(c=>ideItem(c)).join('')||ideEmpty(isUser?'ri-user-6-line':'ri-folder-line',isUser?'暂无全局安装内容':'暂无项目安装内容',isUser?'目标为 User · 我的环境，对所有项目生效。':'目标为 Project · 工作区，仅当前项目生效。');
  }
  else if(tab==='updates') body = (groups.updates.map(c=>ideItem(c)).join('')||ideEmpty('ri-arrow-up-circle-line','全部已是最新合规版本','')) + `<div style="margin-top:4px"><button class="btn secondary sm" data-action="check-all-updates"><i class="ri-refresh-line"></i>检查全部更新</button></div>`;
  return `
  <div class="breadcrumb"><span>安住 Agent / Agent 管理</span><span class="subtle">（Web 原型中的 Agent 模拟面板）</span></div>
  <div class="ide-frame" data-theme="dark">
    <div class="ide-titlebar"><span class="tl-dots"><i style="background:#f87171"></i><i style="background:#fbbf24"></i><i style="background:#34d399"></i></span><span class="tl-title"><i class="ri-terminal-box-line"></i>安住 Agent — Agent 管理</span></div>
    <div class="ide-body">
      <div class="ide-side snav snav-accent">
        <div class="sn-title">Agent MARKET</div>
        ${tabs.map(t=>`<button class="${tab===t.k?'active':''}" data-action="go" data-id="/ide/${t.k}"><i class="${t.icon}"></i>${t.l}<span class="cnt nums">${t.c}</span></button>`).join('')}
      </div>
      <div class="ide-main">${body}</div>
    </div>
  </div>`;
}
function ideEmpty(icon,title,sub){ return `<div class="empty"><span class="e-icon"><i class="${icon}"></i></span><div class="e-title">${title}</div><div class="e-desc">${sub}</div></div>`; }
function ideItem(c){
  const ins=c.install;
  let actions='';
  if(ins.managed){
    actions=`<button class="btn secondary sm" data-action="managed-reject" data-id="${c.id}"><i class="ri-pause-circle-line"></i>禁用</button><button class="btn secondary sm" data-action="managed-reject" data-id="${c.id}"><i class="ri-delete-bin-line"></i>卸载</button>`;
  }else if(ins.state==='ready'){
    actions=`<button class="btn secondary sm" data-action="ide-disable" data-id="${c.id}"><i class="ri-pause-circle-line"></i>禁用</button><button class="btn danger sm" data-action="ide-uninstall" data-id="${c.id}"><i class="ri-delete-bin-line"></i>卸载</button>`;
  }else if(ins.state==='disabled'){
    actions=`<button class="btn primary sm" data-action="ide-enable" data-id="${c.id}"><i class="ri-play-line"></i>启用</button><button class="btn danger sm" data-action="ide-uninstall" data-id="${c.id}"><i class="ri-delete-bin-line"></i>卸载</button>`;
  }else if(ins.state==='configuration_required'){
    actions=`<button class="btn primary sm" data-action="ide-config" data-id="${c.id}"><i class="ri-links-line"></i>完成配置</button><button class="btn danger sm" data-action="ide-uninstall" data-id="${c.id}"><i class="ri-close-line"></i>取消安装</button>`;
  }else if(ins.state==='error'){
    actions=`<button class="btn primary sm" data-action="ide-retry" data-id="${c.id}"><i class="ri-restart-line"></i>重试安装</button><button class="btn danger sm" data-action="ide-uninstall" data-id="${c.id}"><i class="ri-delete-bin-line"></i>清理卸载</button>`;
  }else if(ins.state==='unknown'){
    actions=`<button class="btn secondary sm" data-action="ide-resync" data-id="${c.id}"><i class="ri-refresh-line"></i>重新同步</button>`;
  }else if(['requested','installing'].includes(ins.state)){
    actions=`<span class="muted" style="font-size:12px;display:inline-flex;align-items:center;gap:6px"><i class="ri-loader-4-line spin"></i>执行中…</span>`;
  }
  if(ins.updateAvailable && !ins.managed) actions=`<button class="btn primary sm" data-action="ide-update" data-id="${c.id}"><i class="ri-arrow-up-circle-line"></i>更新到 v${ins.updateAvailable}</button>`+actions;
  if(ins.updateFailed) actions=`<button class="btn primary sm" data-action="ide-update" data-id="${c.id}"><i class="ri-restart-line"></i>重试更新</button><button class="btn secondary sm" data-action="ide-rollback" data-id="${c.id}"><i class="ri-history-line"></i>版本回退</button>`+actions;
  return `<div class="card ide-item">
    <div class="ii-head"><h4>${esc(c.name)}</h4>${typeBadge(c.type)}${stateBadge(ins.state)}
      ${ins.managed?'<span class="tag t-pink">由组织管理</span>':''}
      ${ins.updateAvailable?`<span class="tag t-teal"><i class="ri-arrow-up-circle-line"></i>可更新 v${ins.updateAvailable}</span>`:''}
      <div class="ii-actions">${actions}</div></div>
    <div class="ii-meta nums">
      <span>目标：${esc(ins.target)}</span><span>版本：v${esc(ins.version||c.version)}</span><span>策略：${POLICY_LABEL[c.policy]}${c.pinned?` · 固定 v${c.pinned}`:''}</span><span>安装于 ${esc(ins.since)}</span>
      ${ins.reason?`<span style="color:var(--color-danger-fg)" class="mono">reason_code=${esc(ins.reason)}</span>`:''}
      ${ins.state==='unknown'?`<span style="color:var(--color-warning-fg)">状态待同步 · 最后确认值非「未安装」</span>`:''}
    </div>
    ${ins.updateFailed?`<div class="banner b-danger ii-banner"><i class="ri-history-line"></i><div class="b-body">更新失败，已自动恢复并保留旧版本 v${esc(ins.oldVersion||c.version)}；可重试更新或版本回退（不创建新 Installation）。</div></div>`:''}
    ${ins.managed?`<div class="banner b-info ii-banner"><i class="ri-building-2-line"></i><div class="b-body">由组织管理（ACTIVE + FORCED）：保持启用。支持 Owner：${esc(c.ownerTeam||c.publisher.name)} · <a data-action="show-audit">审计入口</a></div></div>`:''}
    ${['requested','installing'].includes(ins.state)?'<div class="progress-track th-indeterminate" style="margin-top:10px"></div>':''}
  </div>`;
}

const TOAST_ICON={ok:'ri-checkbox-circle-line',err:'ri-close-circle-line',warn:'ri-alert-line',info:'ri-information-line'};
function toast(msg,kind){
  const root=document.getElementById('toast-root');
  const el=document.createElement('div');
  el.className='toast '+(kind||'info');
  el.innerHTML=`<i class="${TOAST_ICON[kind]||TOAST_ICON.info}"></i><span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},3200);
}
function openModal(title,desc,body,foot,wide){
  document.getElementById('modal-root').innerHTML=`<div class="mask" data-action="close-modal"><div class="modal ${wide?'wide':''}">
    <div class="m-head"><div><div class="m-title">${title}</div>${desc?`<div class="m-desc">${desc}</div>`:''}</div><button class="m-x" data-action="close-modal"><i class="ri-close-line"></i></button></div>
    <div class="m-body">${body}</div>
    ${foot?`<div class="m-foot">${foot}</div>`:''}
  </div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ---- Web → Agent InstallIntent 安装闭环（PRD 8.2 / 12.1） ---- */
let handoffTarget='user';
function startInstall(cid){
  const c=byId(cid);
  let it=pendingIntent(cid);
  if(!it){
    it={id:uid('it'), contentId:cid, releaseId:c.releaseId, status:'GENERATED', idem:uid('idem'), sourcePage:'content_detail', expiresAt:Date.now()+10*60*1000};
    state.intents.push(it);
    audit('install_intent_generated', c.name, `intent_id=${it.id} · idempotency_key=${it.idem} · source_page=content_detail`);
  }
  state.activeIntent=it; handoffTarget='user';
  renderHandoff();
  if(it.status==='GENERATED') setTimeout(()=>{ if(it.status==='GENERATED'){ it.status='OPENED'; renderHandoff(); render(); } },900);
}
function renderHandoff(){
  const it=state.activeIntent; if(!it) return;
  const c=byId(it.contentId); const ins=c.install;
  const steps=[
    {k:'gen',l:'生成 InstallIntent（不创建 Installation）'},
    {k:'open',l:'唤起 安住 Agent（安住 Agent · 能力启用）'},
    {k:'verify',l:'Agent 重新校验身份、目标、运行环境、权限与组织策略'},
    {k:'accept',l:'确认目标 → ACCEPTED ack（installation_id）→ 创建唯一 Installation'},
    {k:'exec',l:'下载 → 校验 checksum → 落盘 → 默认启用'},
  ];
  let stage=0;
  if(it.status==='OPENED') stage=1;
  if(it.status==='ACCEPTED') stage= ins&&['installing'].includes(ins.state)?4 : (ins&&ins.state==='requested'?3:5);
  if(it.status==='ACCEPTED'&&ins&&['ready','configuration_required'].includes(ins.state)) stage=5;

  let body='';
  if(it.status==='OPENED' && !ins){
    body=`<div>
        <div style="font-size:13px;font-weight:600;margin-bottom:8px">选择安装目标（InstallationTarget）</div>
        <div class="target-opt ${handoffTarget==='user'?'sel':''}" data-action="pick-target" data-id="user"><i class="ri-user-6-line"></i><div><div class="t-name">User · 我的环境</div><div class="t-desc">对所有项目生效</div></div></div>
        <div class="target-opt ${handoffTarget==='p1'?'sel':''}" data-action="pick-target" data-id="p1"><i class="ri-folder-line"></i><div><div class="t-name">安住 · 找房服务</div><div class="t-desc">仅当前项目工作区</div></div></div>
        <div class="target-opt ${handoffTarget==='p2'?'sel':''}" data-action="pick-target" data-id="p2"><i class="ri-folder-line"></i><div><div class="t-name">安住 · 经纪人协作服务</div><div class="t-desc">仅当前项目工作区</div></div></div>
      </div>
      <div class="banner b-info" style="margin:0"><i class="ri-information-line"></i><div class="b-body">Agent 将重新校验登录身份、可见性、有效 Distribution、客户端版本与目标环境运行环境；Project 无权限时要求重选，不降级为 User。</div></div>`;
  }else if(it.status==='GENERATED'){
    body=`<div style="text-align:center;padding:22px 0"><i class="ri-loader-4-line spin" style="font-size:22px;color:var(--color-accent)"></i><div style="margin-top:10px;font-size:13px">正在唤起 安住 Agent…</div><div class="muted" style="font-size:12px;margin-top:4px">若唤起失败，可重试唤起（复用同一 idempotency_key）或复制操作信息</div></div>`;
  }else if(ins && ins.state==='installing'){
    body=`<div><div class="progress-track th-indeterminate"></div><div class="muted" style="font-size:12px;margin-top:10px">下载中 → 校验 artifact checksum 与文件清单 → 落盘（同一 Installation：<span class="mono">${esc(ins.id||'')}</span>）</div></div>`;
  }else if(ins && (ins.state==='ready'||ins.state==='configuration_required')){
    body=`<div class="banner ${ins.state==='ready'?'b-success':'b-warning'}" style="margin:0"><i class="${ins.state==='ready'?'ri-checkbox-circle-line':'ri-links-line'}"></i><div class="b-body">${ins.state==='ready'?'已可用：ready 且运行时刷新成功，desired_state=enabled。':'待配置：包已安装但不可用，需完成「'+esc(c.requiresConfig||'必需连接')+'」配置后进入 ready。'}</div></div>`;
  }
  const foot = (it.status==='OPENED' && !ins)
    ? `<button class="btn secondary" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-install"><i class="ri-check-line"></i>确认安装</button>`
    : (ins && (ins.state==='ready'||ins.state==='configuration_required'))
      ? `<button class="btn secondary" data-action="close-modal">完成</button>${ins.state==='configuration_required'?`<button class="btn primary" data-action="ide-config" data-id="${c.id}"><i class="ri-links-line"></i>完成配置</button>`:`<button class="btn primary" data-action="use" data-id="${c.id}"><i class="ri-play-circle-line"></i>去使用</button>`}`
      : (it.status==='GENERATED' ? `<button class="btn secondary" data-action="close-modal">关闭</button>` : '');
  openModal(
    `在 安住 中安装 · ${esc(c.name)}`,
    `InstallIntent <span class="mono">${esc(it.id)}</span> · 状态 <b>${esc(it.status)}</b> · idempotency_key <span class="mono">${esc(it.idem)}</span>`,
    `<div class="vsteps">${steps.map((s,i)=>`<div class="vstep ${i<stage?'done':i===stage?'now':''}">
        <div class="vs-rail"><span class="vs-dot">${i<stage?'<i class="ri-check-line"></i>':i+1}</span>${i<steps.length-1?'<span class="vs-line"></span>':''}</div>
        <div class="vs-body"><div class="vs-title">${s.l}</div></div>
      </div>`).join('')}</div>${body}`,
    foot);
}
function confirmInstall(){
  const it=state.activeIntent; if(!it) return;
  const c=byId(it.contentId);
  const targetLabel=handoffTarget==='user'?'User · 我的环境':handoffTarget==='p1'?'安住 · 找房服务':'安住 · 经纪人协作服务';
  it.status='ACCEPTED';
  const insId=uid('ins');
  c.install={id:insId, state:'requested', target:targetLabel, since:new Date().toISOString().slice(0,10)};
  audit('install_requested', c.name, `intent_id=${it.id} → installation_id=${insId} · target=${targetLabel} · 唯一键创建`);
  renderHandoff(); render();
  setTimeout(()=>{ if(c.install&&c.install.id===insId){ c.install.state='installing'; renderHandoff(); render(); } },800);
  setTimeout(()=>{
    if(c.install&&c.install.id===insId){
      c.install.state = c.requiresConfig ? 'configuration_required' : 'ready';
      audit('install_succeeded', c.name, `outcome=${c.install.state==='ready'?'ready':'configuration_required'}（同一 Installation）`);
      if(c.install.state==='ready') audit('content_enabled', c.name, '首次进入 ready · 默认启用并刷新运行时');
      toast(c.install.state==='ready' ? `「${c.name}」安装完成，已可用` : `「${c.name}」包已安装，等待完成配置`, c.install.state==='ready'?'ok':'warn');
      renderHandoff(); render();
    }

/* ---- 审核决定 ---- */
function decide(taskId,decision){
  const t=REVIEW_TASKS.find(x=>x.id===taskId); if(!t||t.status!=='PENDING') return;
  if(t.submitter===ME.name){ toast('提交人不能审核自己的任务，请由其他部门管理员处理','err'); return; }
  const comment=(document.getElementById('review-comment')||{}).value||'';
  if(decision==='CHANGES_REQUESTED' && !comment.trim()){
    toast('退回修改时，请填写具体问题和修改建议','err'); return;
  }
  const hasBlock=(t.checks||[]).some(ch=>ch.r==='block');
  if(decision==='APPROVED' && hasBlock){ toast('存在阻断项，不能「通过并发布」','err'); return; }
  t.status='DECIDED'; t.decision=decision; t.by='李昂（部门管理员）'; t.at=new Date().toLocaleString('zh-CN',{hour12:false}); t.comment=comment;
  audit('review_decided', t.name, `decision=${decision} · reviewer=李昂（部门管理员）`);
  if(decision==='APPROVED'){
    const scopes=(t.scopes&&t.scopes.length)?t.scopes:['移动端 · 安住 AI'];
    const nc={ id:uid('c'), type:t.type, name:t.name, version:t.version, releaseId:uid('rel'),
      desc:t.desc, owner:t.submitter, ownerTeam:t.department||t.support||'找房策略组', tags:[], industry:'通用', task:'通用',
      sourceKind:'NATIVE', facets:['EnterpriseOfficial'], upstream:{id:'acme',name:t.submitter},
      publisher:{id:'acme-platform',name:t.publisher}, supply:'Original',
      policy:t.policy, scope:scopes[0], updatePolicy:t.updatePolicy, pinned:t.pinned,
      compat:'compatible', minIDE:'1.20.0', platforms:['macOS','Windows','Linux'],
      installs:0, favs:0, active30:0, exec30:0,
      permissions:reviewTools(t).map(tool=>({name:tool.name,level:tool.actions.includes('保存')?'高':'中',desc:`${tool.desc} · 操作：${tool.actions.join('、')}`})), scan:'pass', review:{state:'APPROVED',by:'李昂',at:t.at.slice(0,10)},
      checksum:t.checksum, releasedAt:t.at.slice(0,10),
      capability:t.desc, io:{input:'—',output:'—'}, highlights:[t.desc],
      releaseNotes:`v${t.version}：首次发布。`, install:null };
    CONTENTS.unshift(nc);
    if(t.contentItemId){
      const item=MY_ITEMS.find(x=>x.id===t.contentItemId);
      if(item) Object.assign(item,{contentId:nc.id,status:'PUBLISHED',marketState:'已发布',draft:null,release:'v'+t.version+' · PUBLISHED',reviewState:'APPROVED',mtime:'刚刚',releaseFlow:false});
    }
    audit('version_published', t.name, `审核通过并发布 · version=${t.version}`);
    toast(`「${t.name}」已通过并发布`,'ok');
    setTimeout(()=>nav('#/detail/'+nc.id),700);
  }else{
    if(t.contentItemId){
      const item=MY_ITEMS.find(x=>x.id===t.contentItemId);
      if(item) Object.assign(item,{status:'DRAFT',marketState:'草稿',reviewState:'CHANGES_REQUESTED',mtime:'刚刚'});
    }
    toast(`「${t.name}」已退回修改`,'warn');
    render();
  }
}

function captureReleaseDetails(){
  const f=state.releaseFlow;
  const value=id=>((document.getElementById(id)||{}).value||'').trim();
  if(document.getElementById('release-name')) f.name=value('release-name');
  if(document.getElementById('release-summary')) f.summary=value('release-summary');
  if(document.getElementById('release-description')) f.description=value('release-description');
  if(document.getElementById('release-category')) f.category=value('release-category');
  if(document.getElementById('release-owner')) f.owner=value('release-owner');
  if(document.getElementById('release-rules')) f.rules=value('release-rules');
  if(document.getElementById('release-version')) f.version=value('release-version')||'1.0.0';
  if(document.getElementById('release-notes')) f.releaseNotes=value('release-notes');

function captureReleaseConfig(){

function persistReleaseDraft(){

function currentQuery(){ return parseHash().query; }
function applyMarketQuery(q){
  const parts=Object.entries(q).filter(([,v])=>v).map(([k,v])=>k+'='+encodeURIComponent(v));
  nav('#/market'+(parts.length?'?'+parts.join('&'):''), true);
}
function applyTaskQuery(q){
  const parts=Object.entries(q).filter(([,v])=>v && v!=='all').map(([k,v])=>k+'='+encodeURIComponent(v));
  nav('#/me/local'+(parts.length?'?'+parts.join('&'):''), true);
}
function applyToolQuery(q){
  const parts=Object.entries(q).filter(([,v])=>v && v!=='all').map(([k,v])=>k+'='+encodeURIComponent(v));
  nav('#/me/tools'+(parts.length?'?'+parts.join('&'):''), true);
}
function toolQueryFromForm(){
  return {
    q:((document.getElementById('tool-catalog-q')||{}).value||'').trim(),
    mode:((document.getElementById('tool-catalog-mode')||{}).value||'all'),
    action:((document.getElementById('tool-catalog-action')||{}).value||'all')
  };
}
let searchTimer=null;
document.addEventListener('input',e=>{
  if(e.target.id==='market-q'){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      const q=currentQuery(); q.q=e.target.value;
      refocusSearch=true; skipAnim=true;
      applyMarketQuery(q);
    },250);
  }
  if(e.target.id==='task-manage-q'){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      const q=currentQuery(); q.q=e.target.value;
      refocusTaskSearch=true; skipAnim=true;
      applyTaskQuery(q);
    },250);
  }
  if(e.target.id==='tool-catalog-q'){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      const q=toolQueryFromForm();
      refocusToolSearch=true; skipAnim=true;
      applyToolQuery(q);
    },250);
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='task-manage-state'){
    const q=currentQuery(); q.state=e.target.value;
    applyTaskQuery(q); return;
  }
  if(e.target.id==='tool-catalog-mode'||e.target.id==='tool-catalog-action'){
    applyToolQuery(toolQueryFromForm()); return;
  }
  if(e.target.id==='release-package-file'){
    const file=e.target.files&&e.target.files[0];
    state.releaseFlow.fileName=file?file.name:'';
    render(); return;
  }
  if(e.target.id==='release-icon-file'){
    const file=e.target.files&&e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ state.releaseFlow.customIcon=String(reader.result||''); render(); };
    reader.readAsDataURL(file); return;
  }
  if(e.target.name==='release-timing'){
    captureReleaseConfig(); state.releaseFlow.timing=e.target.value; render(); return;
  }
  if(e.target.name==='release-audience'){
    captureReleaseConfig(); render(); return;
  }
  if(e.target.id==='release-echo'){
    captureReleaseConfig(); state.releaseFlow.echo=e.target.checked; render(); return;
  }
  const f=e.target.closest('[data-filter]');
  if(f){
    const q=currentQuery();
    const cur=(q[f.dataset.filter]||'').split(',').filter(Boolean);
    if(f.checked) cur.push(f.value); else cur.splice(cur.indexOf(f.value),1);
    q[f.dataset.filter]=[...new Set(cur)].join(',');
    applyMarketQuery(q);
  }
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.dropdown')) document.querySelectorAll('.dropdown.open').forEach(d=>d.classList.remove('open'));
  if(!e.target.closest('.filter-group')) document.querySelectorAll('.filter-group.open').forEach(g=>g.classList.remove('open'));
  const el=e.target.closest('[data-action]');
  if(!el) return;
  if(el.classList.contains('mask') && e.target!==el) return; // 点击弹窗内部内容不触发遮罩关闭
  const fn=ACTIONS[el.dataset.action];
  if(fn){ e.preventDefault(); fn(el.dataset.id, el.dataset.x, el, e); }
  const menu=el.closest('.menu'); if(menu) menu.closest('.dropdown').classList.remove('open');
});

mountNavAvatar();
render();
  })(adminDocument, adminWindow, adminLocation, adminHistory, safeStorage, safeAnimationFrame, setTimeout, clearTimeout, console);
};

      if (action === 'review-decision') { state.reviewDecision = id === 'approve' ? '通过并发布' : id === 'changes' ? '需修改' : '拒绝'; toast(`已模拟审核决定：${state.reviewDecision}`); }
      if (action === 'toast') toast(message);
      if (action === 'toggle-pane') { if (id === 'mobile') state.mobileCollapsed = !state.mobileCollapsed; if (id === 'admin') state.adminCollapsed = !state.adminCollapsed; }
      render();
    });
    window.addEventListener('message', event => {
      if (event.data && event.data.type === 'task-center-mobile') { state.mode = 'mobile'; render(); }
      if (event.data && event.data.type === 'task-center-admin-route' && typeof event.data.route === 'string') state.adminRoute = event.data.route;
    });
    render();
  </script>
</body>
</html>
