<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Center · PRD Demo</title>
  <meta name="description" content="找房 Agent 工具广场与 Skill 管理后台交互演示">
  <style>
    :root {
      /* KED(贝壳 B 端)tokens — 对齐 ke-style/assets/design-tokens.css */
      --bg: #F5F5F5;
      --surface: #ffffff;
      --surface-soft: #F0F0F0;
      --line: #EEEEEE;
      --text: #222222;
      --muted: #666666;
      --blue: #1A66FF;
      --blue-soft: #E0EDFF;
      --teal: #00A666;
      --teal-soft: #EBFFF7;
      --amber: #FAA241;
      --amber-soft: #FFF3E0;
      --red: #E82222;
      --red-soft: #FEEDED;
      --purple: #5472E3;
      --purple-soft: #EEF1FC;
      --shadow: 0 4px 12px rgba(0, 0, 0, .10);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; }
    .topbar { height: 52px; display: flex; align-items: center; gap: 20px; padding: 0 clamp(20px, 5vw, 72px); background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
    .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 4px; color: white; background: linear-gradient(145deg, #1A66FF, #0050E6); box-shadow: 0 5px 12px rgba(26, 102, 255,.25); }
    .brand small { color: var(--muted); font-weight: 500; letter-spacing: 0; }
    .mode-switch { display: flex; gap: 4px; padding: 4px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 4px; }
    .mode-switch button { border: 0; background: transparent; color: var(--muted); padding: 7px 12px; border-radius: 4px; font-size: 13px; }
    .mode-switch button.active { color: var(--blue); background: var(--surface); box-shadow: 0 1px 4px rgba(26, 102, 255,.08); font-weight: 600; }
    .top-note { margin-left: auto; color: var(--muted); font-size: 12px; }
    .page { max-width: 1240px; margin: 0 auto; padding: 34px 24px 60px; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 28px; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 4px 0 6px; font-size: clamp(26px, 4vw, 38px); line-height: 1.2; letter-spacing: -.04em; }
    h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    h3 { margin: 0; font-size: 14px; }
    .intro p { max-width: 660px; margin: 0; color: var(--muted); }
    .demo-pill { color: var(--blue); background: var(--blue-soft); border: 1px solid #E0EDFF; border-radius: 999px; padding: 7px 11px; font-size: 12px; white-space: nowrap; }
    .button { border: 1px solid transparent; border-radius: 4px; padding: 8px 12px; background: var(--surface); color: var(--text); font-weight: 600; font-size: 13px; }
    .button.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    .button.secondary { border-color: var(--line); }
    .button.danger { color: var(--red); background: var(--red-soft); border-color: #F5A5A5; }
    .button.small { padding: 6px 9px; font-size: 12px; }
    .tag, .status { display: inline-flex; align-items: center; gap: 5px; border-radius: 2px; padding: 2px 8px; font-size: 11px; line-height: 18px; font-weight: 600; }
    .tag { color: var(--muted); background: #F0F0F0; }
    .status.ready { color: var(--teal); background: var(--teal-soft); }
    .status.review { color: var(--amber); background: var(--amber-soft); }
    .status.draft { color: var(--blue); background: var(--blue-soft); }
    .status.pause { color: var(--red); background: var(--red-soft); }
    .status.release { color: var(--purple); background: var(--purple-soft); }
    .empty { color: var(--muted); text-align: center; padding: 30px; }
    .mobile-demo { display: grid; grid-template-columns: minmax(0, 1.2fr) 320px; gap: 48px; align-items: center; }
    .mobile-copy { max-width: 570px; }
    .mobile-copy .rule-list { display: grid; gap: 12px; margin-top: 25px; }
    .rule-item { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
    .rule-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--blue-soft); color: var(--blue); font-size: 14px; }
    .rule-item strong { display: block; font-size: 13px; }
    .rule-item span { display: block; color: var(--muted); font-size: 13px; }
    .phone { width: 348px; margin: 0 auto; padding: 9px; border: 8px solid #202733; background: #202733; border-radius: 39px; box-shadow: 0 24px 50px rgba(0, 0, 0,.23); }
    .phone-screen { position: relative; height: 648px; overflow: hidden; border-radius: 28px; background: #F5F5F5; }
    .phone-status { display: flex; justify-content: space-between; padding: 13px 19px 7px; color: #222222; background: #fff; font-size: 10px; font-weight: 800; }
    .host-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 17px 12px; background: #fff; }
    .host-brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; letter-spacing: -.03em; }
    .host-brand-mark { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; color: #fff; background: linear-gradient(145deg, #8AB5FF, #3D7FFF); font-size: 13px; }
    .host-location { color: #999999; font-size: 10px; font-weight: 500; }
    .host-avatar, .circle-button { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 50%; color: #666666; background: #F0F0F0; font-size: 15px; }
    .host-body { height: calc(100% - 85px); overflow: auto; padding: 4px 15px 78px; }
    .host-hero { padding: 17px; color: #fff; background: linear-gradient(135deg, #5472E3, #8AB5FF); border-radius: 8px; }
    .host-hero span { display: block; opacity: .88; font-size: 11px; }
    .host-hero strong { display: block; margin-top: 4px; font-size: 18px; }
    .host-hero p { margin: 4px 0 0; opacity: .9; font-size: 11px; }
    .host-section { display: flex; align-items: center; justify-content: space-between; margin: 17px 1px 9px; font-size: 13px; font-weight: 800; }
    .host-section span { color: #999999; font-size: 10px; font-weight: 500; }
    .house-card { display: grid; grid-template-columns: 86px 1fr; gap: 10px; padding: 9px; margin-bottom: 9px; border: 1px solid #EEEEEE; border-radius: 8px; background: #fff; }
    .house-image { display: grid; min-height: 65px; place-items: center; border-radius: 4px; color: #666666; background: linear-gradient(135deg, #E0EDFF, #FFF3E0); font-size: 20px; }
    .house-card strong { display: block; font-size: 12px; }
    .house-card p { margin: 3px 0; color: #666666; font-size: 10px; }
    .house-card b { color: #E64B3E; font-size: 12px; font-family: 'DIN PRO', 'DIN Alternate', -apple-system, sans-serif; }
    .host-empty { padding: 70px 14px; color: #999999; text-align: center; font-size: 12px; }
    .host-nav { position: absolute; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #EEEEEE; background: rgba(255,255,255,.97); }
    .host-nav button { display: grid; gap: 3px; place-items: center; border: 0; background: transparent; color: #999999; padding: 9px 2px 11px; font-size: 10px; }
    .host-nav button span { font-size: 17px; line-height: 1; }
    .host-nav button.active { color: #222222; font-weight: 800; }
    .ai-fab { position: absolute; right: 17px; bottom: 17px; z-index: 3; display: flex; align-items: center; gap: 7px; border: 0; color: #fff; background: linear-gradient(135deg, #8AB5FF, #3D7FFF 62%, #5472E3); box-shadow: 0 9px 20px rgba(26, 102, 255,.30); border-radius: 999px; padding: 7px 11px 7px 7px; font-size: 11px; font-weight: 800; }
    .ai-fab span { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; background: rgba(255,255,255,.2); font-size: 15px; }
    .ai-overlay { position: absolute; inset: 0; z-index: 8; background: rgba(0, 0, 0,.26); }
    .ai-panel { position: absolute; top: 39px; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 8px 16px 0 0; background: #FFFFFF; box-shadow: 0 -12px 32px rgba(0, 0, 0,.15); }
    .ai-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 17px; background: linear-gradient(180deg, #EEF1FC, #FFFFFF 90%); }
    .ai-brand { display: flex; align-items: center; gap: 8px; color: #2E3138; font-size: 13px; font-weight: 800; }
    .ai-brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 4px; color: #fff; background: linear-gradient(135deg, #8AB5FF, #3D7FFF); font-size: 17px; }
    .ai-head-actions { display: flex; gap: 7px; }
    .ai-head-actions button { width: 30px; height: 30px; border: 0; border-radius: 50%; color: #2E3138; background: rgba(255,255,255,.82); font-size: 16px; }
    .ai-task-strip { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; border-bottom: 1px solid #EEEEEE; color: #666666; background: #fff; font-size: 11px; }
    .ai-task-strip button { border: 0; color: #5472E3; background: transparent; font-size: 10px; font-weight: 700; }
    .ai-chat { flex: 1; min-height: 0; overflow: auto; padding: 15px 16px 8px; }
    .chat-meta { display: flex; gap: 6px; align-items: center; color: #999999; font-size: 10px; }
    .chat-meta .thinking { color: #666666; font-weight: 700; }
    .chat-bubble { max-width: 90%; padding: 10px 11px; margin: 10px 0; border: 1px solid #EEEEEE; background: #fff; border-radius: 8px 8px 8px 2px; color: #2E3138; font-size: 12px; line-height: 1.65; }
    .chat-bubble.mine { margin-left: auto; border-color: #E0EDFF; background: #E0EDFF; border-radius: 8px 8px 2px 8px; }
    .chat-list { display: grid; gap: 6px; margin: 8px 0 10px; }
    .chat-link { border: 0; padding: 0; color: #5472E3; background: transparent; text-align: left; text-decoration: underline; font-size: 12px; font-weight: 700; }
    .tool-call { margin: 9px 0; border: 1px solid #E0EDFF; background: #EBFFF7; color: #666666; border-radius: 4px; padding: 8px; font-size: 10px; }
    .tool-call b { font-weight: 700; }
    .tool-call button { margin-left: 4px; border: 0; color: #666666; background: transparent; padding: 0; text-decoration: underline; font-size: 10px; }
    .ai-compose { display: flex; align-items: center; gap: 7px; padding: 10px 12px 12px; background: linear-gradient(180deg, rgba(252,252,253,.7), #fff 35%); }
    .ai-compose-mark { width: 32px; height: 32px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: #fff; background: linear-gradient(135deg, #8AB5FF, #3D7FFF); font-size: 16px; }
    .ai-input { display: flex; align-items: center; flex: 1; gap: 7px; min-width: 0; padding: 5px 6px 5px 11px; border: 1px solid #EEEEEE; border-radius: 999px; color: #999999; background: #fff; font-size: 11px; }
    .ai-input-placeholder { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-add-button { width: 29px; height: 29px; display: grid; flex: 0 0 auto; place-items: center; border: 0; border-radius: 50%; color: #222222; background: #EEEEEE; font-size: 21px; font-weight: 400; line-height: 1; }
    .ai-legal { padding-bottom: 8px; color: #999999; text-align: center; font-size: 9px; }
    .task-drawer-backdrop { position: absolute; inset: 0; z-index: 12; background: rgba(0, 0, 0,.34); }
    .task-drawer { position: absolute; top: 0; bottom: 0; left: 0; z-index: 13; width: 85%; padding: 17px 15px; background: #fff; box-shadow: 9px 0 22px rgba(0, 0, 0,.12); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; margin: 3px 2px 20px; font-size: 15px; font-weight: 800; }
    .drawer-head button { border: 0; color: #999999; background: transparent; font-size: 19px; }
    .drawer-new { width: 100%; border: 1px solid #EEEEEE; border-radius: 8px; color: #2E3138; background: #fff; padding: 12px; font-size: 13px; font-weight: 800; }
    .drawer-section { display: flex; align-items: center; justify-content: space-between; margin: 24px 3px 9px; color: #999999; font-size: 11px; }
    .drawer-task { width: 100%; padding: 11px 10px; border: 0; border-radius: 4px; color: #2E3138; background: transparent; text-align: left; }
    .drawer-task.active { color: #1A66FF; background: #E0EDFF; }
    .drawer-task strong, .drawer-task span { display: block; }
    .drawer-task strong { font-size: 12px; }
    .drawer-task span { margin-top: 2px; color: #999999; font-size: 10px; }
    .drawer-task-title { display: flex; align-items: center; gap: 5px; }
    .drawer-task .drawer-task-title strong { display: block; }
    .drawer-task .drawer-lifecycle, .drawer-task .drawer-progress { display: inline-flex; width: auto; align-items: center; margin: 0; border-radius: 999px; padding: 2px 5px; font-size: 9px; line-height: 1; }
    .drawer-task .drawer-lifecycle { color: #666666; background: #F5F5F5; }
    .drawer-task .drawer-progress { color: #1A66FF; background: #E0EDFF; font-weight: 800; }
    .ai-task-strip i { margin-left: 4px; border-radius: 999px; padding: 2px 5px; color: #1A66FF; background: #E0EDFF; font-size: 9px; font-style: normal; font-weight: 800; }
    .drawer-tool-link { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 11px 10px; border: 0; border-radius: 4px; color: #2E3138; background: #F5F5F5; text-align: left; font-size: 12px; font-weight: 700; }
    .task-tool-backdrop { position: absolute; inset: 0; z-index: 9; background: rgba(0, 0, 0,.25); }
    .task-tool-sheet { position: absolute; right: 0; bottom: 0; left: 0; z-index: 10; padding: 14px 15px 17px; border-radius: 8px 16px 0 0; background: #fff; box-shadow: 0 -10px 28px rgba(0, 0, 0,.12); }
    .tool-sheet-handle { width: 34px; height: 4px; margin: 0 auto 12px; border-radius: 999px; background: #D8D8D8; }
    .tool-sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .tool-sheet-head strong { display: block; font-size: 14px; }
    .tool-sheet-head span { display: block; margin-top: 2px; color: #999999; font-size: 10px; }
    .tool-sheet-head button { border: 0; color: #999999; background: #F0F0F0; border-radius: 50%; width: 26px; height: 26px; font-size: 15px; }
    .task-tool-row { display: flex; align-items: center; gap: 9px; padding: 9px 2px; border-top: 1px solid #EEEEEE; }
    .task-tool-row-main { flex: 1; min-width: 0; }
    .task-tool-row-main strong { display: block; font-size: 12px; }
    .task-tool-row-main span { display: block; color: #999999; font-size: 10px; }
    .task-tool-call { border: 0; border-radius: 4px; color: #fff; background: #5472E3; padding: 6px 8px; font-size: 10px; font-weight: 700; }
    .tool-manage-button { width: 100%; margin-top: 10px; border: 0; border-radius: 4px; color: #1A66FF; background: #F5F5F5; padding: 10px; font-size: 11px; font-weight: 800; }
    .hub { height: calc(100% - 30px); background: #F5F5F5; }
    .hub-head { display: grid; grid-template-columns: 34px 1fr 58px; align-items: center; padding: 13px 15px 11px; background: #fff; }
    .hub-head h3 { margin: 0; text-align: center; font-size: 16px; }
    .hub-head button { min-height: 30px; border: 0; border-radius: 4px; color: #2E3138; background: #F0F0F0; font-size: 11px; }
    .hub-head .back { width: 30px; font-size: 19px; }
    .hub-scroll { height: calc(100% - 56px); overflow: auto; padding: 12px 14px 22px; }
    .market-search { padding: 10px 11px; color: #999999; border-radius: 8px; background: #EEEEEE; font-size: 11px; }
    .market-tabs { display: flex; gap: 14px; margin: 14px 2px 9px; color: #999999; font-size: 11px; }
    .market-tabs .active { color: #2E3138; font-weight: 800; }
    .tool-hero { display: flex; gap: 9px; padding: 12px; border-radius: 8px; color: #fff; background: linear-gradient(135deg, #3D7FFF, #5472E3); }
    .tool-hero .tool-logo { flex: 0 0 auto; color: #fff; background: rgba(255,255,255,.18); }
    .tool-hero strong { display: block; font-size: 13px; }
    .tool-hero p { margin: 3px 0 0; opacity: .88; font-size: 10px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 16px 2px 8px; color: #222222; font-weight: 800; font-size: 13px; }
    .section-title span { color: #999999; font-size: 10px; font-weight: 600; }
    .category-row { display: flex; gap: 7px; overflow: auto; margin: 0 0 9px; padding-bottom: 2px; scrollbar-width: none; }
    .category-chip { flex: 0 0 auto; border: 0; border-radius: 999px; color: #999999; background: #EEEEEE; padding: 5px 8px; font-size: 10px; }
    .category-chip.active { color: #2E3138; background: #E0EDFF; font-weight: 800; }
    .skill-row { position: relative; display: flex; align-items: center; gap: 9px; padding: 11px 44px 11px 10px; margin-top: 8px; border-radius: 8px; background: #fff; }
    .tool-logo { width: 33px; height: 33px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 4px; color: var(--blue); background: #E0EDFF; font-size: 16px; }
    .skill-row-main { min-width: 0; }
    .skill-row-main strong { display: block; font-size: 12px; }
    .skill-row-main p { display: -webkit-box; overflow: hidden; margin: 2px 0 0; color: #999999; font-size: 10px; line-height: 1.35; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .card-action { position: absolute; top: 50%; right: 10px; width: 27px; height: 27px; border: 0; color: #2E3138; background: #EEEEEE; border-radius: 8px; transform: translateY(-50%); font-size: 18px; line-height: 1; }
    .card-action.on { color: var(--teal); background: var(--teal-soft); font-size: 12px; font-weight: 800; }
    .my-tool { display: flex; align-items: center; gap: 9px; padding: 11px 2px; border-bottom: 1px solid #EEEEEE; }
    .my-tool-main { flex: 1; min-width: 0; }
    .my-tool-main strong { display: block; font-size: 12px; }
    .my-tool-main span { display: block; color: #999999; font-size: 10px; }
    .tiny-button { border: 0; color: #666666; background: #EEEEEE; border-radius: 6px; padding: 5px 6px; font-size: 10px; }
    /* Mobile AI landing and plus menu */
    .assistant-landing { position: relative; height: calc(100% - 30px); overflow: hidden; background: #fff; }
    .landing-top { display: flex; align-items: center; gap: 12px; padding: 17px 17px 0; }
    .landing-menu { width: 42px; height: 42px; border: 0; border-radius: 50%; color: #222222; background: #fff; box-shadow: 0 7px 20px rgba(0, 0, 0,.08); font-size: 25px; line-height: 1; }
    .landing-product { display: grid; gap: 1px; }
    .landing-product strong { font-size: 19px; letter-spacing: -.03em; }
    .landing-product span { color: #999999; font-size: 11px; }
    .landing-main { padding: 82px 19px 104px; }
    .landing-mark { width: 82px; height: 82px; display: grid; place-items: center; margin: 0 0 26px 6px; border: 1px solid #E0EDFF; border-radius: 8px; color: #fff; background: radial-gradient(circle at 30% 24%, #C5D9FF, transparent 31%), linear-gradient(135deg, #8AB5FF, #3D7FFF 62%, #5472E3); box-shadow: 0 16px 32px rgba(26, 102, 255,.18); font-size: 39px; }
    .landing-main h2 { margin: 0 0 21px; color: #222222; font-size: 28px; line-height: 1.24; letter-spacing: -.055em; }
    .landing-prompts { display: grid; justify-items: start; gap: 10px; }
    .landing-prompt { border: 1px solid #EEEEEE; border-radius: 999px; color: #2E3138; background: #fff; box-shadow: 0 3px 10px rgba(0, 0, 0,.035); padding: 9px 13px; font-size: 12px; text-align: left; }
    .landing-prompt span { margin-right: 7px; color: #999999; }
    .landing-refresh { margin: 17px 0 0 4px; border: 0; color: #999999; background: #F5F5F5; border-radius: 4px; padding: 7px 10px; font-size: 11px; }
    .landing-compose { position: absolute; right: 15px; bottom: 15px; left: 15px; display: flex; align-items: center; gap: 9px; padding: 7px 7px 7px 13px; border: 1px solid #EEEEEE; border-radius: 999px; background: #fff; box-shadow: 0 10px 26px rgba(0, 0, 0,.09); }
    .landing-compose > span { color: #2E3138; font-size: 19px; }
    .landing-compose .landing-placeholder { flex: 1; color: #999999; font-size: 13px; }
    .landing-plus { width: 35px; height: 35px; display: grid; place-items: center; border: 0; border-radius: 50%; color: #222222; background: #F5F5F5; font-size: 27px; font-weight: 300; line-height: 1; }
    .assistant-chat { height: calc(100% - 30px); display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    .assistant-chat .ai-panel-head { padding: 14px 17px; background: #fff; border-bottom: 1px solid #F0F0F0; }
    .assistant-chat .ai-task-strip { padding: 9px 17px; background: #fff; }
    .assistant-chat .ai-chat { padding: 15px 16px 8px; }
    .assistant-chat .ai-compose { padding: 10px 13px 8px; }
    .assistant-chat .ai-legal { padding-bottom: 8px; }
    .task-tool-backdrop { z-index: 15; background: rgba(0, 0, 0,.34); }
    .task-tool-sheet { z-index: 16; padding: 14px 15px 20px; border-radius: 8px 16px 0 0; }

    .conversation-title { gap: 7px; }
    .conversation-title strong { min-width: 0; font-size: 13px; }
    .conversation-status { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 6px 18px; }
    .conversation-status small { margin: 0; }
    .drawer-conversation > span { margin-left: 18px; line-height: 1.7; }
    .conversation-state-note { padding: 10px 12px; margin-bottom: 16px; color: #666666; border: 1px solid #EEEEEE; background: #fff; border-radius: 8px; font-size: 12px; }
    .conversation-state-note.waiting { color: #FAA241; background: #FFF3E0; border-color: #D8D8D8; }
    .archived-compose { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-top: 1px solid #EEEEEE; color: #999999; font-size: 12px; }
    .archived-compose button { min-height: 40px; padding: 8px 14px; border: 0; border-radius: 8px; color: #1A66FF; background: #E0EDFF; font-weight: 600; }

    /* Linked demo canvas: mobile on the left, management platform on the right. */
    .linked-demo { height: calc(100vh - 52px); display: grid; grid-template-columns: 382px minmax(0, 1fr); gap: 12px; padding: 12px; overflow: hidden; }
    .linked-pane { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 8px 28px rgba(26, 102, 255,.06); }
    .linked-pane-head { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--line); color: #666666; background: #F5F5F5; font-size: 12px; font-weight: 700; }
    .linked-pane-head span { color: #999999; font-weight: 500; }
    .linked-mobile { overflow: auto; background: #F5F5F5; }
    .linked-mobile .mobile-demo { display: block; }
    .linked-mobile .phone { width: 348px; margin: 12px auto 20px; padding: 4px; border-width: 5px; border-radius: 39px; }
    .linked-mobile .phone-screen { height: max(600px, calc(100vh - 132px)); max-height: 720px; border-radius: 30px; }
    .linked-admin { display: flex; flex-direction: column; }
    .linked-admin .marketplace-host { flex: 1; min-height: 0; height: auto; }

    /* Collapsible panes: each side folds into a slim edge rail. */
    .linked-demo { transition: grid-template-columns .28s ease; }
    .linked-demo.mobile-collapsed { grid-template-columns: 40px minmax(0, 1fr); }
    .linked-demo.admin-collapsed { grid-template-columns: minmax(0, 1fr) 40px; }
    .linked-demo.mobile-collapsed.admin-collapsed { grid-template-columns: 40px minmax(0, 1fr) 40px; }
    .pane-head-text { min-width: 0; }
    .pane-toggle { flex: 0 0 auto; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #999999; font-size: 14px; line-height: 1; cursor: pointer; }
    .pane-toggle:hover { background: #EEEEEE; color: #222222; }
    .linked-pane.collapsed { display: block; padding: 0; }
    .pane-expand { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; height: 100%; padding: 12px 0; border: 0; background: transparent; color: #999999; cursor: pointer; }
    .pane-expand:hover { background: #F0F0F0; color: #222222; }
    .pane-expand i { font-style: normal; font-size: 15px; }
    .pane-expand span { writing-mode: vertical-rl; font-size: 11px; letter-spacing: 3px; }
    .phone-status-icons { display: inline-flex; align-items: center; gap: 4px; }

    /* The AI remains a floating layer over the original Anzhu product. */
    .host-shell { position: relative; height: calc(100% - 36px); overflow: hidden; background: #F5F5F5; }
    .host-shell .host-body { height: calc(100% - 58px); padding-bottom: 90px; }
    .host-shell .host-nav { z-index: 2; }
    .host-shell .ai-fab { bottom: 78px; }
    .host-shell .ai-overlay { inset: 0; z-index: 8; }
    .host-shell .ai-panel { top: 18px; }
    .ai-panel > .assistant-landing,
    .ai-panel > .assistant-chat,
    .ai-panel > .hub { height: 100%; }
    .assistant-landing .landing-close { margin-left: auto; width: 40px; height: 40px; border: 0; border-radius: 8px; color: #222222; background: #F5F5F5; font-size: 22px; }
    .tool-hero { width: 100%; border: 0; text-align: left; cursor: pointer; }
    .ddf-progress { margin-top: 10px; padding: 10px 11px; border-radius: 8px; color: #666666; background: #F5F5F5; font-size: 11px; line-height: 1.65; }

    /* 盯盯房任务详情页：任务条件、双列公开房源 Feed、经纪人线索与补充。 */
    .ddf-hero { padding: 18px 0 16px; border-bottom: 1px solid #EEEEEE; }
    .ddf-hero-top { display: flex; align-items: center; gap: 10px; }
    .ddf-hero .tool-logo { width: 40px; height: 40px; border-radius: 8px; font-size: 19px; }
    .ddf-hero h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .ddf-hero-sub { margin-top: 3px; color: #999999; font-size: 10px; }
    .ddf-hero-top > .lifecycle-badge { margin-left: auto; }
    .ddf-hero p { margin: 10px 0 0; color: #666666; font-size: 12px; line-height: 1.7; }
    .ddf-schedule { display: flex; gap: 7px; align-items: center; margin-top: 12px; padding: 9px 10px; border-radius: 8px; color: #666666; background: #F5F5F5; font-size: 10px; line-height: 1.6; }
    .ddf-schedule b { color: #2E3138; }
    .ddf-conds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .ddf-cond { padding: 9px 10px; border: 1px solid #EEEEEE; border-radius: 8px; background: #fff; }
    .ddf-cond span { display: block; color: #999999; font-size: 9px; }
    .ddf-cond strong { display: block; margin-top: 3px; font-size: 11px; }
    .ddf-tabs { display: flex; gap: 18px; margin-top: 16px; border-bottom: 1px solid #EEEEEE; }
    .ddf-tabs button { position: relative; border: 0; padding: 8px 0 10px; color: #999999; background: transparent; font-size: 12px; }
    .ddf-tabs button.active { color: #2E3138; font-weight: 800; }
    .ddf-tabs button.active::after { content: ''; position: absolute; bottom: -1px; left: 50%; width: 18px; height: 3px; border-radius: 999px; background: #1A66FF; transform: translateX(-50%); }
    .ddf-tabs .ddf-unread { display: inline-grid; min-width: 15px; height: 15px; place-items: center; margin-left: 4px; padding: 0 4px; border-radius: 999px; color: #fff; background: #E64B3E; font-size: 9px; font-style: normal; font-weight: 800; }
    .ddf-feed { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
    .ddf-house { overflow: hidden; border: 1px solid #EEEEEE; border-radius: 8px; background: #fff; }
    .ddf-house-img { display: grid; height: 62px; place-items: center; color: #666666; background: linear-gradient(135deg, #E0EDFF, #FFF3E0); font-size: 18px; }
    .ddf-house-body { padding: 8px 9px 10px; }
    .ddf-house-body strong { display: block; font-size: 11px; }
    .ddf-house-body p { margin: 3px 0; color: #999999; font-size: 9px; line-height: 1.5; }
    .ddf-house-body b { color: #E64B3E; font-size: 12px; font-family: 'DIN PRO', 'DIN Alternate', -apple-system, sans-serif; }
    .ddf-house-badge { display: inline-block; margin-bottom: 4px; padding: 2px 5px; border-radius: 4px; color: #1A66FF; background: #E0EDFF; font-size: 9px; font-weight: 700; }
    .ddf-house-badge.old { color: #999999; background: #F0F0F0; }
    .ddf-leads { display: grid; gap: 9px; margin-top: 12px; }
    .ddf-lead { padding: 11px; border: 1px solid #EEEEEE; border-radius: 8px; background: #fff; }
    .ddf-lead-top { display: flex; align-items: center; gap: 7px; }
    .ddf-lead-top strong { flex: 1; min-width: 0; font-size: 11px; }
    .ddf-lead-kind { flex: 0 0 auto; padding: 2px 5px; border-radius: 4px; color: #5472E3; background: #E0EDFF; font-size: 9px; font-weight: 700; }
    .ddf-lead-top time { flex: 0 0 auto; color: #999999; font-size: 9px; }
    .ddf-lead p { margin: 7px 0 9px; color: #666666; font-size: 11px; line-height: 1.7; }
    .ddf-lead-contact { border: 0; border-radius: 4px; color: #1A66FF; background: #E0EDFF; padding: 7px 10px; font-size: 10px; font-weight: 700; }
    .ddf-onsite { margin-top: 14px; padding: 12px; border-radius: 8px; background: #FFF8EC; color: #8A6D3B; font-size: 10px; line-height: 1.8; }
    .ddf-onsite b { display: block; color: #2E3138; font-size: 11px; }
    .ddf-confirm { margin-top: 14px; padding: 12px; border: 1px solid #F5C6C0; border-radius: 8px; background: #FFF5F4; color: #666666; font-size: 10px; line-height: 1.8; }
    .ddf-confirm b { display: block; color: #E64B3E; font-size: 11px; }
    .ddf-detail-footer { flex: 0 0 auto; display: flex; gap: 9px; padding: 10px 16px 16px; border-top: 1px solid #F0F0F0; background: #fff; }
    .ddf-detail-footer .button { flex: 1; min-height: 42px; border-radius: 8px; font-size: 13px; }
    .ddf-detail-footer .button.danger-ghost { color: #E64B3E; border: 1px solid #F5C6C0; background: #fff; }
    .ddf-detail-footer .button.danger { color: #fff; border-color: #E64B3E; background: #E64B3E; }
    .ddf-end-note { flex: 0 0 auto; padding: 12px 16px 18px; border-top: 1px solid #F0F0F0; color: #999999; background: #fff; text-align: center; font-size: 10px; line-height: 1.8; }
    .ddf-update { display: flex; align-items: center; gap: 9px; width: 100%; margin-top: 10px; padding: 11px 12px; border: 1px solid #E0EDFF; border-radius: 8px; background: linear-gradient(135deg, #F4F8FF, #FFFFFF); text-align: left; }
    .ddf-update .tool-logo { width: 30px; height: 30px; }
    .ddf-update-main { flex: 1; min-width: 0; }
    .ddf-update-main strong { display: flex; align-items: center; gap: 5px; color: #2E3138; font-size: 12px; }
    .ddf-update-dot { width: 6px; height: 6px; border-radius: 50%; background: #E64B3E; }
    .ddf-update-main p { margin: 2px 0 0; color: #999999; font-size: 10px; }
    .ddf-update-arrow { color: #999999; font-size: 14px; }
    .ai-strip-actions { display: flex; flex: 0 0 auto; gap: 10px; }
    .task-light.terminated { --light: #CCCCCC; }
    .lifecycle-badge.terminated { color: #999999; background: #F0F0F0; }

    /* 会话 → 工具详情：会话内工具调用可点击 */
    .tool-call-link { margin: 0 2px; border: 0; padding: 0; color: #1A66FF; background: transparent; font-size: 10px; font-weight: 700; text-decoration: underline; }
    /* 工具详情页 → 任务中心入口卡 */
    .ddf-task-link { display: flex; align-items: center; gap: 9px; width: 100%; margin-top: 10px; padding: 12px; border: 1px solid #E0EDFF; border-radius: 8px; background: linear-gradient(135deg, #F4F8FF, #FFFFFF); text-align: left; }
    .ddf-task-link-main { flex: 1; min-width: 0; }
    .ddf-task-link-main strong { display: block; font-size: 12px; }
    .ddf-task-link-main p { margin: 2px 0 0; color: #999999; font-size: 10px; }
    /* 任务执行页：执行时间链 */
    .ddf-timeline { padding: 2px 2px 0; }
    .ddf-tl-item { position: relative; display: grid; grid-template-columns: 12px 1fr; gap: 10px; padding-bottom: 15px; }
    .ddf-tl-item::before { content: ''; position: absolute; top: 14px; bottom: 1px; left: 4px; width: 1.5px; background: #EEEEEE; }
    .ddf-tl-item:last-child::before { display: none; }
    .ddf-tl-dot { z-index: 1; width: 10px; height: 10px; margin-top: 3px; border-radius: 50%; background: #1A66FF; }
    .ddf-tl-item.live .ddf-tl-dot { background: #00B578; }
    .ddf-tl-item.planned .ddf-tl-dot { border: 2px solid #9DB9F5; background: #fff; }
    .ddf-tl-item.end .ddf-tl-dot { background: #CCCCCC; }
    .ddf-tl-item.planned .ddf-tl-title, .ddf-tl-item.planned .ddf-tl-desc, .ddf-tl-item.end .ddf-tl-title, .ddf-tl-item.end .ddf-tl-desc { color: #999999; }
    .ddf-tl-time { color: #999999; font-size: 9px; }
    .ddf-tl-title { margin-top: 1px; color: #2E3138; font-size: 11px; font-weight: 700; }
    .ddf-tl-desc { margin: 2px 0 0; color: #666666; font-size: 10px; line-height: 1.6; }
    /* 会话内任务推荐与配置操作区（固定在输入框上方，不随聊天滚动） */
    .ddf-chat-actions { flex: 0 0 auto; display: flex; flex-direction: column; gap: 7px; margin: 0; padding: 2px 16px 6px; background: #fff; }
    .ddf-chat-actions .button { width: 100%; min-height: 38px; border-radius: 8px; font-size: 12px; }
    .ddf-chat-hint { text-align: center; color: #999999; font-size: 10px; }
    .ddf-conds.mini { gap: 6px; margin-top: 8px; }
    .ddf-conds.mini .ddf-cond { padding: 6px 8px; }
    .ddf-conds.mini .ddf-cond strong { font-size: 10px; }
    .chat-bubble .ddf-progress { font-size: 10px; }
    @media (max-width: 1050px) {
      .linked-demo { height: auto; grid-template-columns: 1fr; overflow: visible; }
      .linked-mobile .phone { width: min(390px, calc(100vw - 48px)); }
      .linked-mobile .phone-screen { height: 720px; }
      .linked-admin { min-height: 760px; }
      .linked-demo.mobile-collapsed, .linked-demo.admin-collapsed, .linked-demo.mobile-collapsed.admin-collapsed { grid-template-columns: 1fr; }
      .linked-pane.collapsed { min-height: 0; }
      .pane-expand { flex-direction: row; justify-content: center; height: 40px; padding: 0 12px; }
      .pane-expand span { writing-mode: horizontal-tb; letter-spacing: 1px; }
    }
    @media (max-width: 640px) {
      .linked-demo { padding: 8px; }
      .linked-mobile .phone-screen { height: min(700px, calc(100dvh - 100px)); min-height: 560px; }
    }

    .lifecycle-badge.pending { color: #666666; background: #EEEEEE; }
    .task-light.pending { --light: #999999; }
    .task-group-title { display: flex; gap: 8px; align-items: center; margin: 18px 8px 10px; color: #666666; font-size: 12px; font-weight: 600; }
    .task-group-title span { color: #999999; font-size: 10px; }
    .task-phase { margin-left: 4px !important; }

    .tool-card { padding: 0 58px 0 0; overflow: hidden; }
    .tool-card-open { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; min-height: 96px; padding: 16px 0 16px 14px; border: 0; color: inherit; background: transparent; text-align: left; }
    .tool-card-more { display: block; margin-top: 6px; color: #1A66FF; font-size: 11px; }
    .tool-coming { position: absolute; right: 12px; top: 15px; color: #999999; font-size: 10px; }
    .tool-card:has(.tool-coming) { padding-right: 72px; }
    .hero-detail-link { display: block; margin-top: 10px; font-size: 11px; color: #ffffffda; }
    .tool-detail { display: flex; flex-direction: column; min-height: 0; background: #fff; }
    .tool-detail .hub-head { flex: 0 0 auto; }
    .tool-detail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 24px; overscroll-behavior: contain; }
    .tool-detail-hero { padding: 24px 0 20px; border-bottom: 1px solid #EEEEEE; }
    .tool-detail-hero .tool-logo { width: 56px; height: 56px; margin-bottom: 14px; border-radius: 8px; font-size: 26px; }
    .tool-detail-category { display: block; color: #999999; font-size: 11px; margin-bottom: 6px; }
    .tool-detail-hero h2 { font-size: 24px; letter-spacing: -.03em; }
    .tool-detail-hero p { margin: 8px 0 12px; color: #666666; font-size: 13px; line-height: 1.7; }
    .tool-info-section { margin-top: 24px; }
    .tool-info-section h3 { color: #222222; font-size: 15px; }
    .tool-info-section p, .tool-info-section li { color: #666666; font-size: 13px; line-height: 1.85; }
    .tool-info-section p { margin: 9px 0 0; }
    .tool-info-section ul, .tool-info-section ol { margin: 10px 0 0; padding-left: 20px; }
    .tool-info-section li { padding-left: 3px; margin: 6px 0; }
    .tool-info-section li::marker { color: #1A66FF; }
    .tool-example { margin-top: 22px; padding: 16px; border-radius: 8px; background: #E0EDFF; }
    .tool-example span { color: #5472E3; font-size: 11px; }
    .tool-example p { margin: 8px 0 0; color: #666666; font-size: 13px; line-height: 1.8; }
    .tool-use-note { margin-top: 20px; padding: 13px; border-radius: 8px; background: #F5F5F5; color: #999999; font-size: 11px; line-height: 1.8; }
    .tool-detail-footer { flex: 0 0 auto; padding: 10px 18px 18px; border-top: 1px solid #F0F0F0; background: #fff; }
    .tool-detail-footer p { margin: 0 0 9px; text-align: center; color: #999999; font-size: 10px; }
    .tool-detail-footer .button { width: 100%; min-height: 46px; border-radius: 8px; font-size: 14px; }
    .tool-detail-footer .button:disabled { background: #EEEEEE; border-color: #EEEEEE; color: #999999; cursor: default; }

    .message-composer { position: relative; flex: 0 0 auto; margin: 8px 14px 10px; z-index: 4; }
    .landing-message-composer { position: absolute; bottom: 14px; left: 0; right: 0; }
    .composer-row { display: flex; align-items: end; gap: 7px; padding: 8px; border: 1px solid #D8D8D8; border-radius: 8px; background: #fff; box-shadow: 0 5px 20px #253d6b08; }
    .message-input { flex: 1; min-width: 0; width: 100%; min-height: 42px; max-height: 100px; resize: none; border: 0; outline: 0; padding: 10px 2px; background: transparent; color: #222222; font-size: 13px; line-height: 1.7; }

    .composer-row:focus-within { border-color: #8AB5FF; box-shadow: 0 0 0 3px #E0EDFF; }
    .composer-plus, .message-send { flex: 0 0 36px; width: 36px; height: 40px; border: 0; border-radius: 8px; background: #F5F5F5; color: #5472E3; font-size: 23px; }
    .message-send { color: white; background: #1A66FF; font-size: 20px; }
    .message-send:disabled { color: #999999; background: #EEEEEE; cursor: default; }
    .mention-popover { position: absolute; bottom: calc(100% + 10px); right: 0; left: 0; border: 1px solid #D8D8D8; border-radius: 8px; background: #fff; box-shadow: 0 12px 40px #203b6a22; overflow: hidden; }
    .mention-popover[hidden] { display: none; }
    .mention-menu-title { display: flex; align-items: center; gap: 8px; padding: 12px; color: #2E3138; font-size: 12px; font-weight: 600; border-bottom: 1px solid #EEEEEE; }
    .mention-menu-title span { color: #999999; font-size: 10px; font-weight: 400; }
    .mention-menu-title button { margin-left: auto; min-width: 28px; min-height: 28px; border: 0; border-radius: 8px; color: #999999; background: #F5F5F5; }

    .mention-option.highlighted, .mention-option:hover { background: #E0EDFF; }
    .mention-kind { flex: 0 0 auto; padding: 4px 5px; color: #5472E3; background: #F0F0F0; border-radius: 6px; font-size: 10px; }
    .mention-option strong { display: block; font-size: 12px; }
    .mention-option small { display: block; margin-top: 3px; color: #999999; font-size: 10px; line-height: 1.5; }
    .mention-menu-foot, .mention-empty { padding: 10px 12px; color: #999999; font-size: 10px; }
    .mention-menu-foot { border-top: 1px solid #EEEEEE; }
    .demo-reply-label { display: block; margin-bottom: 5px; font-size: 10px; color: #999999; }
    .reply-pending { color: #999999; font-size: 12px; }
    .reply-pending span { animation: task-breathe 1.5s infinite; }
    .chat-bubble { overflow-wrap: anywhere; }
    @media (prefers-reduced-motion: reduce) { .reply-pending span { animation: none; } }
